const prodDe = it => S.produtos.find(p => p.id === it.produto_id) || {};
const codigoDe = it => prodDe(it).codigo_parceiro || '';
function codigosRepetidos(){
  const c = {};
  S.produtos.forEach(p => { if (p.codigo_parceiro) c[p.codigo_parceiro] = (c[p.codigo_parceiro] || 0) + 1; });
  return new Set(Object.keys(c).filter(k => c[k] > 1));
}
function tsvNfe(p){
  return [['Código','Produto','Un.','Quantidade','Preço un.','Total'].join('\t'), ...itensNfe(p).map(it => [codigoDe(it), it.produto_nome, it.unidade || '', NUM.format(qtdEfetiva(it)), NUM2.format(+it.preco_unit || 0), NUM2.format(qtdEfetiva(it) * (+it.preco_unit || 0))].join('\t')),
    ['', 'Total da nota', '', '', '', NUM2.format(totalNfe(p))].join('\t')].join('\n');
}
function vModalNfe(m){
  const rep = codigosRepetidos();
  const pend = m.pedidos.filter(p => !p.nfe && itensNfe(p).length).length;
  const blocos = m.pedidos.map((p, k) => {
    const its = itensNfe(p), loja = S.lojas.find(l => l.id === p.loja_id) || {};
    const semCod = its.filter(it => !codigoDe(it)).length, dup = its.filter(it => rep.has(codigoDe(it))).length;
    const feitos = its.filter((it, i) => m.ok[p.id + '|' + i]).length;
    if (!its.length) return `<section class="painel compacto"><div class="painel-cab"><h3>${esc(loja.nome || '')} · pedido #${p.numero}</h3></div><p class="dica">Não tem salgados fritos, salgados assados nem massas atendidos. Não precisa de NF-e.</p></section>`;
    return `<section class="painel${p.nfe ? ' compacto' : ''}">
      <div class="nfe-cab"><div><span class="rotulo">Cliente no Parceiro</span><b class="nfe-cli">${loja.codigo_parceiro ? esc(loja.codigo_parceiro) : '<span class="falta">sem código</span>'}</b><span>${esc(loja.nome || '')} · pedido #${p.numero} · ${fmtDia(p.data_entrega)}</span></div>
        <div class="nfe-tot"><span class="rotulo">Total da nota</span><b>${money(totalNfe(p))}</b><span>${its.length} ${its.length === 1 ? 'item' : 'itens'}${p.nfe ? ` · NF-e ${esc(p.nfe)}` : ''}</span></div></div>
      ${!loja.codigo_parceiro ? '<p class="erro">Cadastre o código desta loja no Parceiro em Cadastros → Lojas.</p>' : ''}
      ${semCod || dup ? `<p class="erro">${semCod ? `${semCod} ${semCod === 1 ? 'produto está' : 'produtos estão'} sem código do Parceiro. ` : ''}${dup ? `${dup} com código repetido em outro produto. ` : ''}Confira em Cadastros → Produtos.</p>` : ''}
      <div class="tabela-rolar"><table class="nfe-tab"><thead><tr><th><span class="sr">Digitado</span></th><th>Código</th><th>Produto</th><th class="n">Qtd</th><th class="n">Preço un.</th><th class="n">Total</th></tr></thead><tbody>
        ${its.map((it, i) => { const ok = m.ok[p.id + '|' + i], cod = codigoDe(it); return `<tr class="${ok ? 'nfe-ok' : ''}"><td><input type="checkbox" aria-label="Digitado: ${esc(it.produto_nome)}" data-a="nfeMarcar" data-chave="${p.id}|${i}"${ok ? ' checked' : ''}></td><td class="nfe-cod">${cod ? esc(cod) : '<span class="falta">—</span>'}${rep.has(cod) ? ' <span class="falta">repetido</span>' : ''}</td><td>${esc(it.produto_nome)}</td><td class="n nfe-qtd">${qty(qtdEfetiva(it))}</td><td class="n">${money(it.preco_unit)}</td><td class="n">${money(qtdEfetiva(it) * it.preco_unit)}</td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="dica">Marque cada item conforme digita no Parceiro (${feitos} de ${its.length}). Confira se o total do Parceiro bate com ${money(totalNfe(p))}.</p>
      <div class="barra-ferr"><button class="btn btn-sm btn-linha" data-a="nfeCopiar" data-k="${k}">Copiar itens</button><label class="sr" for="nfe-${k}">Número da NF-e</label><input id="nfe-${k}" type="text" inputmode="numeric" placeholder="Nº da NF-e emitida" value="${esc(p.nfe || '')}" data-bind="modal.pedidos.${k}.nfe" style="max-width:200px"><button class="btn btn-sm btn-prim" data-a="nfeSalvar" data-k="${k}">Salvar número</button>${p.nfe ? '<span class="ok-txt">NF-e registrada</span>' : ''}</div>
    </section>`;
  }).join('');
  return `<div class="modal-fundo"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mn-tit">
    <header class="m-cab"><div><h2 id="mn-tit">NF-e para o Parceiro</h2><p class="m-sub">Só ${CATEGORIAS_NFE.join(', ').toLowerCase().replace(/, ([^,]*)$/, ' e $1')}, pela quantidade atendida${m.pedidos.length > 1 ? ` · ${pend} ${pend === 1 ? 'nota a emitir' : 'notas a emitir'}` : ''}</p></div><button class="btn-ico" data-a="fechar" aria-label="Fechar">×</button></header>
    ${m.pedidos.length ? blocos : '<p class="vazio">Nenhum pedido separado neste dia para lojas que recebem NF-e.</p>'}
    <p class="dica">Lojas que não recebem NF-e: ${esc(S.lojas.filter(l => l.emite_nfe === false).map(l => l.nome).join(', ') || 'nenhuma')}. Para mudar, edite a loja em Cadastros.</p>
  </div></div>`;
}

/* ---------------- folhas para imprimir ---------------- */
function cabFolha(titulo, p, via, vias){
  const ent = p.entregador_id ? nomePessoa(p.entregador_id) : '';
  return `<header class="f-topo"><div class="f-marca"><img src="${LOGO}" alt=""><div><strong>${esc(CONFIG.EMPRESA.toUpperCase())}</strong><span>${titulo}</span></div></div><div class="f-num">Pedido #${p.numero}<small>Via ${via} de ${vias}</small></div></header>
  <div class="f-meta"><div><span>Loja</span><b>${esc(nomeLoja(p.loja_id))}</b></div><div><span>Entrega</span><b>${fmtDia(p.data_entrega)}/${parseISO(p.data_entrega).getFullYear()}</b></div><div><span>Entregador</span><b>${esc(ent || '—')}</b></div><div><span>${p.nfe ? 'NF-e' : 'Pedido por'}</span><b>${esc(p.nfe || p.solicitante || '—')}</b></div></div>`;
}
function linhasPorCategoria(itens, montar, cols, comSetor){
  let atual = null, h = '';
  const ord = itens.map((it, i) => [it, i]).sort((a, b) => ORDEM_SETOR.indexOf(setorDe(a[0])) - ORDEM_SETOR.indexOf(setorDe(b[0])) || a[1] - b[1]).map(x => x[0]);
  ord.forEach(it => {
    const chave = setorDe(it) + '|' + (it.categoria || '');
    if (chave !== atual){
      atual = chave;
      const rot = comSetor ? `${SETORES[setorDe(it)]}${it.categoria ? ' · ' + it.categoria : ''}` : (it.categoria || '');
      if (rot) h += `<tr class="cat"><td colspan="${cols}">${esc(rot)}</td></tr>`;
    }
    h += montar(it);
  });
  return h;
}
const setoresParaImprimir = (p, filtro) => ORDEM_SETOR.filter(st => (!filtro || filtro === 'todos' || filtro === st) && p.itens.some(it => setorDe(it) === st && +it.qtd_pedida > 0));
function folhaSeparacao(p, via, vias, setor){
  const itens = p.itens.filter(it => +it.qtd_pedida > 0 && setorDe(it) === setor);
  return `<section class="folha">${cabFolha('Folha de separação · ' + SETORES[setor], p, via, vias)}
    <table class="f-tab"><thead><tr><th>Produto</th><th>Un.</th><th class="n">Solicitado</th><th class="n">Atendido</th></tr></thead>
    <tbody>${linhasPorCategoria(itens, it => `<tr><td>${esc(it.produto_nome)}</td><td>${esc(it.unidade || '')}</td><td class="n">${qty(it.qtd_pedida)}</td><td class="caixa"></td></tr>`, 4)}</tbody></table>
    ${p.observacao ? `<p class="f-obs"><b>Obs.:</b> ${esc(p.observacao)}</p>` : ''}
    <div class="f-ass dois"><div>Separado por</div><div>Conferido por</div></div></section>`;
}
function folhaConferencia(p, via, vias){
  const itens = (p.itens || []).filter(it => +it.qtd_pedida > 0 || qtdEfetiva(it) > 0);
  return `<section class="folha">${cabFolha('Conferência de entrega', p, via, vias)}
    <table class="f-tab"><thead><tr><th>Produto</th><th>Un.</th><th class="n">Solicitado</th><th class="n">Atendido</th><th class="n">Preço un.</th><th class="n">Subtotal</th></tr></thead>
    <tbody>${linhasPorCategoria(itens, it => `<tr><td>${esc(it.produto_nome)}</td><td>${esc(it.unidade || '')}</td><td class="n">${qty(it.qtd_pedida)}</td><td class="n"><b>${qty(qtdEfetiva(it))}</b></td><td class="n">${money(it.preco_unit)}</td><td class="n">${money(qtdEfetiva(it) * it.preco_unit)}</td></tr>`, 6, true)}</tbody>
    <tfoot>${setoresDoPedido({itens}).length > 1 ? ORDEM_SETOR.map(st => `<tr><td colspan="5">Subtotal ${SETORES[st]}</td><td class="n">${money(itens.filter(it => setorDe(it) === st).reduce((s2, it) => s2 + qtdEfetiva(it) * it.preco_unit, 0))}</td></tr>`).join('') : ''}<tr><td colspan="5">Total</td><td class="n">${money(totalPedido(p))}</td></tr></tfoot></table>
    ${p.observacao ? `<p class="f-obs"><b>Obs.:</b> ${esc(p.observacao)}</p>` : ''}
    <div class="f-ass"><div>Entregador (nome e assinatura)</div><div>Recebido por (nome e assinatura)</div><div>Data e hora</div></div></section>`;
}

/* ---------------- desenhar ---------------- */
function render(){
  const app = document.getElementById('app');
  const fundo = app.querySelector('.modal-fundo'), rolagem = fundo ? fundo.scrollTop : 0;
  let html;
  if (S.vista === 'acesso') html = vAcesso();
  else if (S.vista === 'login') html = vLogin();
  else if (S.vista === 'semPermissao') html = vSemPermissao();
  else if (S.vista === 'escritorio') html = vEscritorio();
  else html = '<p style="padding:24px">Carregando…</p>';
  app.innerHTML = html + vModal();
  document.body.classList.toggle('com-menu', S.vista === 'escritorio');
  const novoFundo = app.querySelector('.modal-fundo');
  if (novoFundo && fundo) novoFundo.scrollTop = rolagem;
}
let toastTimer;
function toast(msg, tipo){
  const r = document.getElementById('toast-raiz');
  r.innerHTML = `<div class="toast${tipo === 'erro' ? ' erro' : ''}" role="${tipo === 'erro' ? 'alert' : 'status'}">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { r.innerHTML = ''; }, tipo === 'erro' ? 6000 : 3200);
}
async function tentar(fn){
  if (S.ocupado) return;
  S.ocupado = true;
  try { return await fn(); }
  catch(e) { console.error(e); toast(e.message || 'Algo deu errado. Tente de novo.', 'erro'); }
  finally { S.ocupado = false; }
}
async function copiar(texto, titulo, msg){
  try { await navigator.clipboard.writeText(texto); toast(msg || 'Copiado.'); }
  catch(e) { S.modal = {tipo:'copiar', texto, titulo}; render(); }
}
function sessaoExpirou(){ if (S.vista === 'escritorio' || S.vista === 'semPermissao'){ S.vista = 'login'; S.modal = null; S.login.erro = 'Sua sessão expirou. Entre de novo.'; render(); } }

/* ---------------- carregar dados ---------------- */
async function carregarBase(){
  const [lojas, produtos, pessoas] = await Promise.all([api.lojas(), api.produtos(), api.pessoas()]);
  Object.assign(S, {lojas, produtos, pessoas});
}
async function carregarDia(silencioso){
  S.carregando = true; if (!silencioso) render();
  try {
    const d = S.data, eHoje = d === today();
    const [dia, atrasados] = await Promise.all([api.pedidos(d, d), eHoje ? api.pendentesAntes(d) : Promise.resolve([])]);
    if (d !== S.data) return;
    S.pedidosDia = dia; S.atrasados = atrasados;
  } catch(e) { if (!silencioso) toast(e.message, 'erro'); }
  finally { S.carregando = false; }
  if (!silencioso || (S.tela === 'entregas' && !S.modal)) render();
}
async function carregarRel(){
  S.rel.pedidos = null; render();
  try {
    const [y, m] = S.rel.mes.split('-').map(Number);
    const de = `${S.rel.mes}-01`, ate = isoDate(new Date(y, m, 0));
    S.rel.pedidos = await api.pedidos(de, ate);
  } catch(e) { S.rel.pedidos = []; toast(e.message, 'erro'); }
  render();
}
async function carregarTela(){
  if (S.tela === 'entregas') await carregarDia();
  else if (S.tela === 'relatorios') await carregarRel();
  else render();
}
async function carregarAcesso(silencioso){
  const a = S.acc;
  try { a.dados = await api.acessoPainel(a.token); a.erro = ''; }
  catch(e) { a.erro = e.message; if (silencioso && a.dados) a.erro = ''; }
  if (a.dados && a.dados.funcao === 'solicitante' && !a.form.data) a.form.data = proximasEntregas(a.dados.loja.dias_entrega, a.dados.hoje, 1)[0];
  render();
}
function abrirSeparacao(id){
  const sp = S.acc.sep, d = S.acc.dados, st = abaSeparador(d), p = pedidosDoSetor(d, st).find(x => x.id === id);
  if (!p){ toast('Este pedido não está mais na lista.', 'erro'); render(); return; }
  sp.aberto = id; sp.filtroItem = ''; sp.qtd = {};
  if (!sp.nome) sp.nome = nomeGuardado(st);
  p.itens.forEach(i => { sp.qtd[i.id] = i.qtd_atendida != null ? qtyInput(i.qtd_atendida) : ''; });
  window.scrollTo(0, 0); render();
  if (!sp.nome){ const n = document.getElementById('sep-nome'); if (n) n.focus(); }
}
const formSol = () => ({data:'', qtd:{}, observacao:'', filtro:'', fs:{}, editId:null, editNumero:null, revisao:false});
function abrirAcesso(token){
  S.acc = {token, dados:null, erro:'', aba:'pedir', form:formSol(), enviado:null, recebendo:null, sep:{aberto:null, qtd:{}, filtro:'', filtroItem:'', aba:'', nome:''}};
  S.vista = 'acesso';
  render();
  return carregarAcesso();
}
function irPara(tela){
  S.tela = tela; S.modal = null;
  try { if (location.hash.slice(1) !== tela) history.replaceState(null, '', '#' + tela); } catch(e) {}
  window.scrollTo(0, 0);
  carregarTela();
}

/* ---------------- ações ---------------- */
function setCaminho(caminho, valor){
  const partes = caminho.split('.');
  let o = S;
  for (let i = 0; i < partes.length - 1; i++){ if (o[partes[i]] == null) return; o = o[partes[i]]; }
  o[partes[partes.length - 1]] = valor;
}
function abrirPedidoModal(p, erro){
  S.modal = {tipo:'pedido', p:clone(p), origItens:JSON.stringify(p.itens), add:{produto_id:'', qtd:''}, erro:erro || ''};
  render();
}
function camposBasicos(p){
  return {data_entrega:p.data_entrega, entregador_id:p.entregador_id || null, nfe:(p.nfe || '').trim() || null, observacao:(p.observacao || '').trim() || null, recebido_por:(p.recebido_por || '').trim() || null};
}
async function gravarModal(extra){
  const m = S.modal, p = m.p;
  if (!p.data_entrega) throw new Error('Escolha a data de entrega.');
  await api.atualizarPedido(p.id, {...camposBasicos(p), ...(extra || {})});
  if (p.origem === 'loja'){
    const antes = new Map(JSON.parse(m.origItens).map(i => [i.id, i]));
    const mud = p.itens.filter(i => { const a = antes.get(i.id); return a && (a.qtd_atendida !== i.qtd_atendida || +a.preco_unit !== +i.preco_unit); })
      .map(i => ({id:i.id, qtd_atendida:i.qtd_atendida == null ? null : +i.qtd_atendida, preco_unit:+i.preco_unit || 0}));
    if (mud.length) await api.atualizarItens(mud);
  } else {
    p.itens = p.itens.filter(it => +it.qtd_pedida > 0 || +it.qtd_atendida > 0);
    if (JSON.stringify(p.itens) !== m.origItens) await api.substituirItens(p.id, p.itens);
  }
}
async function mudarStatus(p, st, extra){
  const erro = validarAvanco(p, st);
  if (erro) throw Object.assign(new Error(erro), {validacao:true});
  await api.atualizarPedido(p.id, {...camposStatus(p, st), ...(extra || {})});
}
function prepararImpressao(modo, pedidos, marcar, voltar){
  S.modal = {tipo:'imprimir', modo, pedidos, vias: modo === 'separacao' ? 4 : 2, marcar, setor:'todos', voltar};
  render();
}
const pedidosParaImprimir = m => m.modo === 'separacao' ? m.pedidos.filter(p => setoresParaImprimir(p, m.setor).length) : m.pedidos.filter(p => itensValidos(p).length);

const ACOES = {
  ir: el => irPara(el.dataset.tela),
  sair(){ if (api.sair) api.sair(); S.vista = 'login'; S.login.erro = ''; S.modal = null; render(); },
  async instalarApp(){
    if (pedidoInstalar){ const p = pedidoInstalar; pedidoInstalar = null; try { p.prompt(); await p.userChoice; } catch(e) {} render(); return; }
    S.modal = {tipo:'instalar'}; render();
  },
  instalarDepois(){ gravarLocal(CHAVE_SEM_FAIXA, '1'); render(); },
  dia: el => { S.data = addDays(S.data, +el.dataset.d); carregarDia(); },
  hoje(){ S.data = today(); carregarDia(); },
  recarregar: () => tentar(async () => { await carregarBase(); await carregarDia(); }),
  abrir: (el, e) => { e.preventDefault(); tentar(async () => { const p = await api.pedido(el.dataset.id); if (p) abrirPedidoModal(p); else toast('Pedido não encontrado.', 'erro'); }); },
  avancar: el => tentar(async () => {
    const p = await api.pedido(el.dataset.id);
    if (!p) return;
    const prox = STATUS[p.status].next;
    if (prox === 'entregue'){ S.modal = {tipo:'entregar', id:p.id, numero:p.numero, nome:p.recebido_por || ''}; render(); return; }
    const erro = validarAvanco(p, prox);
    if (erro){ abrirPedidoModal(p, erro); return; }
    await mudarStatus(p, prox);
    toast(`Pedido #${p.numero}: ${STATUS[prox].label.toLowerCase()}.`);
    await carregarDia();
  }),
  confirmarEntrega: () => tentar(async () => {
    const m = S.modal, p = await api.pedido(m.id);
    await mudarStatus(p, 'entregue', {recebido_por:(m.nome || '').trim() || null});
    S.modal = null; toast(`Pedido #${p.numero} entregue.`); await carregarDia();
  }),
  lancarPara: el => { S.novo = {...novoForm(), loja_id:el.dataset.loja, data_entrega:S.data}; irPara('novo'); },
  imprimirLote: el => {
    const modo = el.dataset.tipo;
    const ps = S.pedidosDia.filter(p => modo === 'separacao' ? ['novo','separacao'].includes(p.status) : ['pronto','em_rota','entregue'].includes(p.status));
    prepararImpressao(modo, ps, modo === 'separacao' && ps.some(p => p.status === 'novo') ? true : null);
  },
  imprimirUm: el => { const p = S.modal.p, modo = el.dataset.tipo; prepararImpressao(modo, [clone(p)], modo === 'separacao' && p.status === 'novo' ? true : null, clone(S.modal)); },
  imprimirAgora: () => tentar(async () => {
    const m = S.modal, vias = Math.min(10, Math.max(1, parseInt(m.vias, 10) || 1)), peds = pedidosParaImprimir(m);
    const copias = fn => Array.from({length:vias}, (_, i) => fn(i + 1)).join('');
    document.getElementById('print-area').innerHTML = peds.map(p => m.modo === 'separacao'
      ? setoresParaImprimir(p, m.setor).map(st => copias(v => folhaSeparacao(p, v, vias, st))).join('')
      : copias(v => folhaConferencia(p, v, vias))).join('');
    document.getElementById('estilo-pagina').textContent = `@page{size:A4 ${m.modo === 'separacao' ? 'portrait' : 'landscape'};margin:12mm}`;
    if (m.marcar){
      for (const p of peds.filter(x => x.status === 'novo')) await api.atualizarPedido(p.id, camposStatus(p, 'separacao'));
      if (m.voltar) m.voltar.p.status = 'separacao';
    }
    try { window.print(); } catch(e) {}
    S.modal = m.voltar || null;
    if (m.marcar) await carregarDia(); else render();
  }),
  fechar(){
    if (S.modal && ['imprimir','nfe'].includes(S.modal.tipo) && S.modal.voltar){ S.modal = S.modal.voltar; render(); return; }
    S.modal = null; render();
  },
  igualPedido: el => { const st = el.dataset.setor; S.modal.p.itens.forEach(it => { if ((!st || setorDe(it) === st) && it.qtd_atendida == null) it.qtd_atendida = +it.qtd_pedida; }); render(); },
  removerItem: el => { S.modal.p.itens.splice(+el.dataset.i, 1); render(); },
  addItem(){
    const m = S.modal, pr = S.produtos.find(x => x.id === m.add.produto_id), q = parseNum(m.add.qtd);
    if (!pr){ m.erro = 'Escolha o produto para adicionar.'; render(); return; }
    if (!(q > 0)){ m.erro = 'Coloque a quantidade do produto.'; render(); return; }
    m.p.itens.push({produto_id:pr.id, produto_nome:pr.nome, setor:setorDe(pr), categoria:pr.categoria, unidade:pr.unidade, qtd_pedida:q, qtd_atendida: FLUXO.indexOf(m.p.status) >= 1 ? q : null, preco_unit:+pr.preco || 0});
    m.add = {produto_id:'', qtd:''}; m.erro = ''; render();
  },
  salvarModal: () => tentar(async () => {
    try { await gravarModal(); } catch(e) { S.modal.erro = e.message; render(); return; }
    const n = S.modal.p.numero; S.modal = null; toast(`Pedido #${n} salvo.`); await carregarDia();
  }),
  avancarModal: () => tentar(async () => {
    const m = S.modal, p = m.p, prox = STATUS[p.status].next;
    const erro = validarAvanco(p, prox);
    if (erro){ m.erro = erro; render(); return; }
    if (prox === 'entregue' && !(p.recebido_por || '').trim()){ m.erro = 'Preencha "Recebido por" (quem recebeu na loja) antes de marcar entregue.'; render(); return; }
    try { await gravarModal(camposStatus(p, prox)); } catch(e) { m.erro = e.message; render(); return; }
    toast(`Pedido #${p.numero}: ${STATUS[prox].label.toLowerCase()}.`);
    const novo = await api.pedido(p.id);
    if (prox === 'entregue' || !novo) S.modal = null; else abrirPedidoModal(novo);
    await carregarDia();
  }),
  excluirPedido(){
    const p = S.modal.p;
    S.modal = {tipo:'confirmar', titulo:`Excluir o pedido #${p.numero}?`, texto:'O pedido some de vez, inclusive dos relatórios. Se ele só não vai sair, prefira mudar a etapa para "Cancelado".', botao:'Excluir de vez', perigo:true,
      fn: async () => { await api.excluirPedido(p.id); toast(`Pedido #${p.numero} excluído.`); }};
    render();
  },
  confirmarOk: () => tentar(async () => { const fn = S.modal.fn; S.modal = null; await fn(); if (S.vista === 'escritorio'){ await carregarBase(); await carregarTela(); } else render(); }),
  // novo pedido
  repetirUltimo: () => tentar(async () => {
    const ult = await api.ultimoPedido(S.novo.loja_id);
    if (!ult){ toast('Esta loja ainda não tem pedido anterior.'); return; }
    const qtd = {};
    ult.itens.forEach(it => { if (it.produto_id && +it.qtd_pedida > 0) qtd[it.produto_id] = qtyInput(it.qtd_pedida); });
    S.novo.qtd = qtd; render(); toast(`Quantidades copiadas do pedido #${ult.numero} (${fmtDia(ult.data_entrega)}).`);
  }),
  limparNovo(){ const l = S.novo.loja_id, d = S.novo.data_entrega; S.novo = {...novoForm(), loja_id:l, data_entrega:d}; render(); },
  salvarNovo: () => tentar(async () => {
    const f = S.novo;
    if (!f.loja_id){ toast('Escolha a loja.', 'erro'); return; }
    if (!f.data_entrega){ toast('Escolha a data de entrega.', 'erro'); return; }
    const itens = S.produtos.filter(p => p.ativo && (parseNum(f.qtd[p.id]) || 0) > 0).sort(porCatNome).map(p => ({produto_id:p.id, produto_nome:p.nome, setor:setorDe(p), categoria:p.categoria, unidade:p.unidade, qtd_pedida:parseNum(f.qtd[p.id]), qtd_atendida:null, preco_unit:+p.preco || 0}));
    if (!itens.length){ toast('Coloque a quantidade de pelo menos um produto.', 'erro'); return; }
    const ped = await api.criarPedido({loja_id:f.loja_id, data_entrega:f.data_entrega, entregador_id:f.entregador_id || null, solicitante:f.solicitante.trim() || null, origem:'escritorio', observacao:f.observacao.trim() || null}, itens);
    toast(`Pedido #${ped.numero} lançado para ${fmtDia(f.data_entrega)}.`);
    S.data = f.data_entrega; S.novo = novoForm(); irPara('entregas');
  }),
  // relatórios
  relCarregar: () => carregarRel(),
  verFatura: (el, e) => { e.preventDefault(); S.rel.loja = el.dataset.loja; render(); const f = document.getElementById('rel-loja'); if (f) f.scrollIntoView({block:'center'}); },
  faturaImprimir: el => {
    const r = S.rel, ids = el.dataset.todas ? S.lojas.filter(l => r.pedidos.some(p => p.loja_id === l.id && p.status === 'entregue')).map(l => l.id) : [r.loja];
    if (!ids.length || !ids[0]){ toast('Nenhuma entrega no mês para imprimir.', 'erro'); return; }
    document.getElementById('print-area').innerHTML = ids.map(id => folhaFatura(id, calcFatura(r.pedidos, id))).join('');
    document.getElementById('estilo-pagina').textContent = '@page{size:A4 landscape;margin:10mm}';
    try { window.print(); } catch(e) {}
    if (S.modo === 'demo') toast('Se a janela de impressão não abrir aqui, ela abre no site publicado.');
  },
  copiarTabela: el => copiar(TSV[el.dataset.t] || '', 'Copiar tabela', 'Tabela copiada. Cole no Excel.'),
  // cadastros
  cadAba: el => { S.cad = {aba:el.dataset.aba, ed:null, erro:'', filtro:'', setor:''}; render(); },
  cadNovo(){

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const fn = ACOES[el.dataset.a];
  if (fn){ if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault(); fn(el, e); }
});
function aplicarBind(el){
  const v = el.type === 'checkbox' ? el.checked : el.value;
  setCaminho(el.dataset.bind, v);
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.qtd){
    const naLoja = S.vista === 'acesso', qtds = naLoja ? S.acc.form.qtd : S.novo.qtd;
    qtds[el.dataset.qtd] = el.value;
    const linha = el.closest('.prod-linha'); if (linha) linha.classList.toggle('tem', (parseNum(el.value) || 0) > 0);
    const lista = naLoja ? S.acc.dados.produtos : S.produtos.filter(p => p.ativo);
    const r = document.getElementById('novo-resumo'); if (r) r.innerHTML = vResumo(resumoQtds(lista, qtds));
    const pr = lista.find(p => p.id === el.dataset.qtd), tit = pr && document.querySelector(`#fs-${naLoja ? 'sol' : 'novo'}-${setorDe(pr)}`);
    if (tit){ const n = lista.filter(p => setorDe(p) === setorDe(pr) && (parseNum(qtds[p.id]) || 0) > 0).length; const h = tit.parentElement.querySelector('.setor-tit'); let sm = h.querySelector('.sel-setor'); if (!sm && n){ sm = document.createElement('small'); sm.className = 'sel-setor'; h.appendChild(sm); } if (sm) sm.textContent = n ? `${n} no pedido` : ''; }
    return;
  }
  if (el.dataset.sq){
    const sp = S.acc.sep, id = el.dataset.sq;
    sp.qtd[id] = el.value;
    el.classList.toggle('vazio', el.value.trim() === '');
    const p = S.acc.dados.pedidos.find(x => x.id === sp.aberto), it = p && p.itens.find(i => i.id === id);
    const alvo = document.getElementById('falta-' + id); if (alvo && it) alvo.innerHTML = textoFalta(it.qtd_pedida, parseNum(el.value));
    return;
  }
  if (el.dataset.mi != null && S.modal && S.modal.p){
    const it = S.modal.p.itens[+el.dataset.mi], campo = el.dataset.campo, v = parseNum(el.value);
    if (campo === 'qtd_atendida'){ it.qtd_atendida = v; el.classList.toggle('vazio', v == null); }
    const mf = document.getElementById('mf-' + el.dataset.mi); if (mf) mf.innerHTML = textoFalta(it.qtd_pedida, it.qtd_atendida);
    else it[campo] = v == null ? 0 : v;
    const sub = document.getElementById('sub-' + el.dataset.mi); if (sub) sub.textContent = money(qtdEfetiva(it) * (+it.preco_unit || 0));
    const tot = document.getElementById('m-total'); if (tot) tot.textContent = money(totalPedido(S.modal.p));
    return;
  }
  if (el.dataset.i && ENTRADAS[el.dataset.i]) { ENTRADAS[el.dataset.i](el); return; }
  if (el.dataset.bind) aplicarBind(el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.bind) aplicarBind(el);
  if (el.dataset.c && MUDANCAS[el.dataset.c]) MUDANCAS[el.dataset.c](el);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.f === 'login'){
    const email = f.email.value.trim(), senha = f.senha.value;
    if (!email || !senha){ S.login.erro = 'Preencha o e-mail e a senha.'; render(); return; }
    S.login.erro = '';
    tentar(async () => {
      try { await api.entrar(email, senha); } catch(err) { S.login.erro = err.message; render(); return; }
      await entrarNoEscritorio();
    });
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal){ ACOES.fechar(); } });
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (S.vista === 'escritorio' && t && t !== S.tela && ['entregas','novo','relatorios','cadastros','ajuda'].includes(t)) irPara(t); });
setInterval(() => {
  if (document.visibilityState !== 'visible' || S.modal || S.ocupado) return;
  const foco = document.activeElement && document.activeElement.matches('input,textarea,select');
  if (S.vista === 'escritorio' && S.tela === 'entregas' && !foco) carregarDia(true);
  else if (S.vista === 'acesso' && S.acc && S.acc.dados && !S.acc.recebendo && !S.acc.sep.aberto && !foco && (S.acc.dados.funcao !== 'solicitante' || S.acc.aba === 'meus')) carregarAcesso(true);
}, 60000);

}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; if (S.vista) render(); });
window.addEventListener('appinstalled', () => { pedidoInstalar = null; if (S.vista) render(); toast('Pronto! O Parada Pedidos está na tela do celular.'); });
if ('serviceWorker' in navigator && location.protocol === 'https:' && CONFIG.SUPABASE_URL.trim()) navigator.serviceWorker.register('sw.js').catch(() => {});
// O link de cada pessoa fica guardado: se o aplicativo abrir sem o link, usa o último que a pessoa abriu.
function tokenDeAcesso(){
  let daUrl = null;
  try { daUrl = new URLSearchParams(location.search).get('acesso'); } catch(e) {}
  if (daUrl){ gravarLocal(CHAVE_ACESSO, daUrl); return daUrl; }
  const guardado = lerLocal(CHAVE_ACESSO);
  return guardado && emApp() && !api.sessao() ? guardado : null;
}

/* ---------------- início ---------------- */
async function entrarNoEscritorio(){
  if (S.modo === 'real'){
    let ok = false;
    try { ok = await api.eAdmin(); } catch(e) { if (!api.sessao()){ S.vista = 'login'; render(); return; } throw e; }
    if (!ok){ S.vista = 'semPermissao'; render(); return; }
  }
  S.vista = 'escritorio';
  const t = location.hash.slice(1);
  S.tela = ['entregas','novo','relatorios','cadastros'].concat(S.modo === 'demo' ? ['ajuda'] : []).includes(t) ? t : 'entregas';
  await carregarBase();
  await carregarTela();
}
async function iniciar(){
  const configurado = CONFIG.SUPABASE_URL.trim() && CONFIG.SUPABASE_KEY.trim();
  api = configurado ? criarApiSupabase() : criarApiDemo();
  S.modo = api.modo;
  const token = tokenDeAcesso();
  if (token){ await abrirAcesso(token); return; }
  if (S.modo === 'real' && !api.sessao()){ S.vista = 'login'; render(); return; }
  try { await entrarNoEscritorio(); }
  catch(e) { console.error(e); S.vista = S.modo === 'real' ? 'login' : 'escritorio'; S.login.erro = e.message; render(); toast(e.message, 'erro'); }
}
iniciar();
</script>
