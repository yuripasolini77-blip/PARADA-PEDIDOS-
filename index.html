<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parada Pedidos</title>
<meta name="theme-color" content="#BE1B22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parada Pedidos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Marca: vermelho e amarelo da logo Parada Ibiraçu. Layout: faixa vermelha no topo, o dia em foco,
     pedidos em colunas por etapa (no celular empilhados, com o menu embaixo). */
  --bg:#F4F2EC; --surface:#FFFFFF; --surface-2:#F9F8F4; --ink:#1D1A16; --muted:#665F55; --line:#E3DED3;
  --brand:#BE1B22; --brand-strong:#98141A; --brand-ink:#FFFFFF; --brand-soft:#FBE8E8;
  --sun:#F2C12E; --sun-ink:#2A2000; --sun-soft:#FFF4D2;
  --link:#98141A;
  --st-novo:#4F5A66; --st-novo-bg:#E9ECEF;
  --st-sep:#835400; --st-sep-bg:#FFEFC7;
  --st-pronto:#0C6A63; --st-pronto-bg:#DAF1EE;
  --st-rota:#1C539E; --st-rota-bg:#E1EBF9;
  --st-ok:#1C6E36; --st-ok-bg:#DFF1E4;
  --st-cancel:#6B675F; --st-cancel-bg:#ECEAE5;
  --danger:#B42318; --danger-bg:#FDECEA;
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:12px;
  --shadow:0 1px 2px rgba(29,26,22,.06),0 3px 10px rgba(29,26,22,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14120F; --surface:#1E1B17; --surface-2:#25221D; --ink:#F2EFE9; --muted:#ADA699; --line:#38342D;
    --brand:#BE1B22; --brand-strong:#E8524A; --brand-ink:#FFFFFF; --brand-soft:#3A1714;
    --sun:#F2C12E; --sun-ink:#2A2000; --sun-soft:#3A2F0D; --link:#FF8A80;
    --st-novo:#BAC3CD; --st-novo-bg:#2A2E33; --st-sep:#FFCB6B; --st-sep-bg:#3A2E12;
    --st-pronto:#72D6CB; --st-pronto-bg:#10302D; --st-rota:#91B9F2; --st-rota-bg:#182A44;
    --st-ok:#80D497; --st-ok-bg:#15301D; --st-cancel:#ABA69E; --st-cancel-bg:#2C2A27;
    --danger:#FF8A80; --danger-bg:#3A1714;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14120F; --surface:#1E1B17; --surface-2:#25221D; --ink:#F2EFE9; --muted:#ADA699; --line:#38342D;
  --brand:#BE1B22; --brand-strong:#E8524A; --brand-ink:#FFFFFF; --brand-soft:#3A1714;
  --sun:#F2C12E; --sun-ink:#2A2000; --sun-soft:#3A2F0D; --link:#FF8A80;
  --st-novo:#BAC3CD; --st-novo-bg:#2A2E33; --st-sep:#FFCB6B; --st-sep-bg:#3A2E12;
  --st-pronto:#72D6CB; --st-pronto-bg:#10302D; --st-rota:#91B9F2; --st-rota-bg:#182A44;
  --st-ok:#80D497; --st-ok-bg:#15301D; --st-cancel:#ABA69E; --st-cancel-bg:#2C2A27;
  --danger:#FF8A80; --danger-bg:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num-tab,.n,.t-num,td.n,th.n{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- topo ---------- */
.topo{background:var(--brand);color:var(--brand-ink);border-bottom:5px solid var(--sun)}
.topo-in{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca-logo{width:56px;height:56px;border-radius:14px;background:#fff;padding:3px;flex:none;box-shadow:0 0 0 2px var(--sun)}
.marca-logo img{width:100%;height:100%;object-fit:contain;display:block}
.marca-txt{display:flex;flex-direction:column;min-width:0}
.marca-nome{font-family:var(--font-display);font-weight:800;font-size:1.3rem;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.marca-nome em{font-style:normal;color:var(--sun)}
.marca-sub{font-size:.8rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo-dir{display:flex;align-items:center;gap:10px;font-size:.85rem}
.quem{opacity:.9;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-topo{background:transparent;border:1.5px solid rgba(255,255,255,.7);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700}
.btn-topo:hover{background:rgba(255,255,255,.12)}
.selo{background:var(--sun);color:var(--sun-ink);font-weight:800;border-radius:999px;padding:4px 10px;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}

.abas{background:var(--surface);border-bottom:1px solid var(--line)}
.abas-in{max-width:1280px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto}
.aba{display:flex;align-items:center;gap:8px;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.aba:hover{color:var(--ink)}
.aba.ativa{color:var(--brand-strong);border-bottom-color:var(--brand)}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.l-curta{display:none}

.faixa-demo{background:var(--sun-soft);border-bottom:1px solid var(--line)}
.faixa-demo-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:.9rem}
.faixa-demo-in p{flex:1 1 320px}
.faixa-demo-in .grupo{display:flex;flex-wrap:wrap;gap:8px}
.passos-app{margin:8px 0 16px;padding-left:22px;display:grid;gap:8px}

.conteudo{max-width:1280px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px}

/* ---------- botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1.5px solid transparent;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--surface-2);color:var(--ink);text-decoration:none;min-height:44px;line-height:1.1;text-align:center}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-prim{background:var(--brand);color:var(--brand-ink)}
.btn-prim:hover{background:var(--brand-strong);filter:none}
.btn-sun{background:var(--sun);color:var(--sun-ink)}
.btn-ok{background:var(--st-ok);color:#fff}
:root[data-theme="dark"] .btn-ok{color:#0B1F10}
.btn-linha{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-linha:hover{border-color:var(--muted);filter:none}
.btn-perigo{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:8px}
.btn-largo{width:100%}
.btn-ico{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.4rem;line-height:1;display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.btn-ico.peq{width:32px;height:32px;font-size:1.1rem}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo label,.rotulo{font-weight:700;font-size:.9rem}
.campo small{color:var(--muted);font-size:.82rem}
.opc{color:var(--muted);font-weight:600}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=date],input[type=month],input[type=tel],input:not([type]),select,textarea{
  width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.form-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.aviso{color:var(--st-sep)!important;font-weight:700}
.erro{background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:10px 12px;font-weight:700}
.dica{color:var(--muted);font-size:.9rem}
.check{display:flex;align-items:center;gap:8px;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--brand)}

/* ---------- etiquetas de etapa ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:800;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-novo{--c:var(--st-novo);--cb:var(--st-novo-bg)}
.st-separacao{--c:var(--st-sep);--cb:var(--st-sep-bg)}
.st-pronto{--c:var(--st-pronto);--cb:var(--st-pronto-bg)}
.st-em_rota{--c:var(--st-rota);--cb:var(--st-rota-bg)}
.st-entregue{--c:var(--st-ok);--cb:var(--st-ok-bg)}
.st-cancelado{--c:var(--st-cancel);--cb:var(--st-cancel-bg)}
.pill{color:var(--c);background:var(--cb)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.74rem;font-weight:800;background:var(--sun-soft);color:var(--sun-ink);border:1px solid var(--sun)}
:root[data-theme="dark"] .tag{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:var(--sun)}}

/* ---------- barra do dia ---------- */
.barra-dia{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.dia-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dia-atual{display:flex;flex-direction:column;min-width:0}
.dia-nome{font-family:var(--font-display);font-weight:800;font-size:1.45rem;line-height:1.1}
.dia-rel{color:var(--muted);font-weight:700;font-size:.88rem}
.dia-input{width:auto!important;min-height:40px!important;padding:6px 10px!important}
.dia-acoes{display:flex;flex-wrap:wrap;gap:8px}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--c,var(--line))}
.t-num{font-family:var(--font-display);font-weight:800;font-size:1.5rem;line-height:1.1}
.t-rot{color:var(--muted);font-size:.85rem;font-weight:700}
.tile-valor{border-top-color:var(--sun)}

.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.painel-alerta{border-left:5px solid var(--st-sep);background:var(--st-sep-bg)}
.painel-cab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.painel-cab .sub{color:var(--muted);font-weight:600;font-size:.9rem;font-family:var(--font-body)}
.lista-mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lista-mini button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lojas-sem{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.loja-sem{border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.loja-sem b{font-weight:800}
.loja-sem small{color:var(--muted)}

/* ---------- quadro por etapa ---------- */
.quadro{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.coluna{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-tit{display:flex;align-items:center;gap:8px;font-size:.95rem;padding:2px 4px}
.col-tit .ponto{width:10px;height:10px;border-radius:50%;background:var(--c)}
.col-n{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:.8rem;font-family:var(--font-body)}
.vazio{color:var(--muted);font-size:.88rem;padding:4px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.card-corpo{background:none;border:0;text-align:left;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:inherit;min-width:0}
.card-corpo:hover .card-loja{text-decoration:underline}
.card-l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-weight:700}
.num{font-weight:800;color:var(--ink)}
.card-loja{font-family:var(--font-display);font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.card-l3{font-size:.88rem;font-variant-numeric:tabular-nums}
.card-ent{font-size:.82rem;color:var(--muted)}
.falta{color:var(--danger);font-weight:800}
.card .btn{margin:0 10px 10px}
.cancelados{font-size:.9rem;color:var(--muted)}

/* ---------- novo pedido / lista de produtos ---------- */
.pagina{display:flex;flex-direction:column;gap:18px}
.pag-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.prod-cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.prod-ferr{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 300px;justify-content:flex-end}
.prod-ferr input{max-width:320px}
.barra-ferr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.barra-ferr input[type=search]{flex:1 1 220px}
.setor-bloco{display:flex;flex-direction:column;gap:4px}
.setor-cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;border-bottom:2px solid var(--line);padding:10px 0 8px}
.setor-tit{display:flex;align-items:center;gap:10px;font-size:1.15rem}
.sel-setor{font-family:var(--font-body);font-size:.8rem;color:var(--brand-strong);font-weight:800}
input.busca-setor{flex:1 1 220px;max-width:340px;min-height:40px;padding:8px 12px}
.setor-tit::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--brand)}
.setor-tit.ind::before{background:var(--sun)}
.setor-tit.emp::before{background:var(--ink)}
.setor-tit.beb::before{background:var(--st-rota)}
.prod-grupo{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding:2px 0}
.prod-grupo>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 2px;font-weight:800;min-height:44px}
.prod-grupo>summary::-webkit-details-marker{display:none}
.prod-grupo>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.prod-grupo[open]>summary::before{transform:rotate(90deg)}
.prod-grupo>summary small{color:var(--muted);font-weight:700}
.prod-grupo>summary .sel{color:var(--brand-strong)}
.prod-grupo .prod-lista{padding-bottom:10px}
.prod-cab{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0}
.prod-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.prod-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.prod-linha.tem{border-color:var(--brand);background:var(--brand-soft)}
.prod-nome{display:flex;flex-direction:column;min-width:0}
.prod-nome span{font-weight:700;overflow-wrap:anywhere}
.prod-nome small{color:var(--muted);font-size:.8rem}
input.qtd{width:92px!important;text-align:right;font-variant-numeric:tabular-nums;font-weight:800;flex:none}
input.qtd.preco{width:100px!important}
input.qtd.vazio{background:var(--sun-soft)}
.rodape-fixo{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.resumo-n{font-family:var(--font-display);font-weight:800;font-size:1.1rem}
.resumo-n small{font-family:var(--font-body);color:var(--muted);font-weight:700;font-size:.85rem;display:block}
.rodape-botoes{display:flex;gap:8px;flex-wrap:wrap}
.esp-dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin:0}
.esp-dados dt{font-size:.8rem;color:var(--muted);font-weight:700}
.esp-dados dd{margin:0;font-weight:800}
.esp-lista{list-style:none;margin:0;padding:0}
.esp-lista li{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.esp-lista li:first-child{border-top:0}
.esp-nome{font-weight:700}
.esp-nome small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.esp-qtd{font-weight:800;white-space:nowrap;text-align:right}
.esp-val{white-space:nowrap;text-align:right;min-width:80px}
.esp-sub{text-align:right;border-top:2px solid var(--line);padding-top:8px;margin:0}
.espelho .rodape-botoes{flex-wrap:nowrap}
@media (max-width:640px){.espelho .rodape-botoes{flex:1 1 100%}.espelho .rodape-botoes .btn-prim{flex:1}}
.datas{display:flex;flex-wrap:wrap;gap:8px}
.data-chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:92px;color:var(--ink)}
.data-chip b{font-family:var(--font-display);font-size:1rem}
.data-chip small{color:var(--muted);font-weight:700;font-size:.78rem}
.data-chip.on{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.data-chip.on small{color:var(--brand-ink);opacity:.9}

/* ---------- tabelas ---------- */
.tabela-rolar{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0}
tr.grupo-linha td{background:var(--surface-2);padding:6px 10px}
.grupo-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-display);font-weight:800}
.card-setores{font-size:.8rem;color:var(--muted);font-weight:700}
.it-nome{font-weight:700;display:block}
td small{color:var(--muted)}
.barra-cel{width:30%;min-width:90px}
.barra{display:block;height:8px;border-radius:4px;background:var(--brand);width:var(--p);min-width:2px}

/* ---------- modal ---------- */
.modal-fundo{position:fixed;inset:0;background:rgba(15,12,10,.55);z-index:50;overflow-y:auto;padding:24px 12px;display:flex;justify-content:center;align-items:flex-start}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:900px;display:flex;flex-direction:column;gap:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.estreito{max-width:480px}
.m-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

<div id="app"><p style="padding:24px">Carregando…</p></div>

<script type="text/plain" id="script-sql">-- =====================================================================
--  PARADA PEDIDOS · Fábrica Parada Ibiraçu
--  Script do banco de dados (Supabase)
--
--  COMO USAR
--  1. Antes de rodar, crie o seu login em Authentication > Users >
--     Add user > Create new user (marque "Auto Confirm User").
--  2. Abra SQL Editor > New query, cole este script inteiro e clique Run.
--  3. Todo e-mail que já existir em Authentication vira administrador.
--
--  Pode rodar de novo sem perder dados: ele só cria o que estiver faltando.
-- =====================================================================

-- ---------- Quem pode usar o painel do escritório ----------
create table if not exists administradores (
  email text primary key
);

create or replace function is_admin() returns boolean
language sql stable security definer set search_path = public as $$
  select exists (
    select 1 from administradores
    where lower(email) = lower(coalesce(auth.jwt() ->> 'email', ''))
  );
$$;

create or replace function hoje_sp() returns date
language sql stable as $$
  select (now() at time zone 'America/Sao_Paulo')::date;
$$;

-- ---------- Lojas ----------
-- dias_entrega: 0 = domingo, 1 = segunda, 2 = terça ... 6 = sábado
create table if not exists lojas (
  id           uuid primary key default gen_random_uuid(),
  nome         text not null,
  endereco     text,
  telefone     text,
  contato      text,
  dias_entrega int[] not null default '{0,1,2,3,4,5,6}',
  codigo_parceiro text,                         -- código do cliente no sistema Parceiro (NF-e)
  emite_nfe    boolean not null default true,    -- false = loja que não recebe NF-e
  ativo        boolean not null default true,
  criado_em    timestamptz not null default now()
);

-- ---------- Produtos ----------
-- setor: 'fabrica' (produção própria), 'industrializados' (revenda), 'bebidas' (bebidas, descartáveis,
--        limpeza e panos) ou 'emporios' (produtos de empório)
create table if not exists produtos (
  id         uuid primary key default gen_random_uuid(),
  nome       text not null,
  categoria  text,
  setor      text not null default 'fabrica',
  unidade    text not null default 'un',
  preco      numeric(12,2) not null default 0,
  codigo_parceiro text,                         -- código do produto no sistema Parceiro (NF-e)
  ativo      boolean not null default true,
  criado_em  timestamptz not null default now()
);

-- ---------- Pessoas com acesso (cada uma tem um link próprio, sem senha) ----------
-- funcao: 'solicitante' (faz pedidos da loja dela), 'separador' (separa os pedidos
--         do setor dele: fabrica, industrializados, bebidas ou emporios; vazio = todos os setores,
--         cada um na sua aba; quem separa escreve o nome a cada separação) ou 'entregador'
create table if not exists pessoas (
  id         uuid primary key default gen_random_uuid(),
  nome       text not null,
  telefone   text,
  funcao     text not null check (funcao in ('solicitante','separador','entregador')),
  loja_id    uuid references lojas(id),
  setor      text,
  token      text not null unique default replace(gen_random_uuid()::text, '-', ''),
  ativo      boolean not null default true,
  criado_em  timestamptz not null default now(),
  constraint solicitante_tem_loja check (funcao <> 'solicitante' or loja_id is not null)
);

-- ---------- Pedidos ----------
create table if not exists pedidos (
  id              uuid primary key default gen_random_uuid(),
  numero          bigint generated always as identity,
  loja_id         uuid not null references lojas(id),
  data_entrega    date not null,
  status          text not null default 'novo'
                  check (status in ('novo','separacao','pronto','em_rota','entregue','cancelado')),
  entregador_id   uuid references pessoas(id) on delete set null,
  solicitante_id  uuid references pessoas(id) on delete set null,
  solicitante     text,                                  -- nome de quem pediu
  origem          text not null default 'escritorio',    -- 'escritorio' ou 'loja'
  observacao      text,
  nfe             text,
  recebido_por    text,
  criado_em       timestamptz not null default now(),
  separado_em     timestamptz,
  saiu_em         timestamptz,
  entregue_em     timestamptz
);

create table if not exists pedido_itens (
  id            uuid primary key default gen_random_uuid(),
  pedido_id     uuid not null references pedidos(id) on delete cascade,
  produto_id    uuid references produtos(id) on delete set null,
  produto_nome  text not null,
  setor         text not null default 'fabrica',
  categoria     text,
  unidade       text,
  qtd_pedida    numeric(12,3) not null default 0,
  qtd_atendida  numeric(12,3),                 -- o que o separador lançou (é o que vale)
  separado_por  text,
  preco_unit    numeric(12,2) not null default 0,
  ordem         int not null default 0
);

-- setores válidos (Fábrica, Industrializados, Bebidas/Outros e Empórios)
alter table produtos drop constraint if exists produtos_setor_check;
alter table produtos add constraint produtos_setor_check check (setor in ('fabrica','industrializados','bebidas','emporios'));
alter table pessoas drop constraint if exists pessoas_setor_check;
alter table pessoas add constraint pessoas_setor_check check (setor in ('fabrica','industrializados','bebidas','emporios'));

alter table lojas    add column if not exists codigo_parceiro text;
alter table lojas    add column if not exists emite_nfe boolean not null default true;
alter table produtos add column if not exists codigo_parceiro text;

create index if not exists pedidos_data_idx       on pedidos (data_entrega);
create index if not exists pedidos_loja_idx       on pedidos (loja_id);
create index if not exists pedidos_entregador_idx on pedidos (entregador_id);
create index if not exists itens_pedido_idx       on pedido_itens (pedido_id);

-- ---------- Segurança: só administradores mexem nas tabelas ----------
alter table administradores enable row level security;
alter table lojas           enable row level security;
alter table produtos        enable row level security;
alter table pessoas         enable row level security;
alter table pedidos         enable row level security;
alter table pedido_itens    enable row level security;

drop policy if exists admin_ve_admins on administradores;
create policy admin_ve_admins on administradores
  for select to authenticated using (is_admin());

drop policy if exists admin_lojas on lojas;
create policy admin_lojas on lojas
  for all to authenticated using (is_admin()) with check (is_admin());

drop policy if exists admin_produtos on produtos;
create policy admin_produtos on produtos
  for all to authenticated using (is_admin()) with check (is_admin());

drop policy if exists admin_pessoas on pessoas;
create policy admin_pessoas on pessoas
  for all to authenticated using (is_admin()) with check (is_admin());

drop policy if exists admin_pedidos on pedidos;
create policy admin_pedidos on pedidos
  for all to authenticated using (is_admin()) with check (is_admin());

drop policy if exists admin_itens on pedido_itens;
create policy admin_itens on pedido_itens
  for all to authenticated using (is_admin()) with check (is_admin());

-- ---------- O solicitado é da loja ----------
-- Em pedido feito pela loja, ninguém do painel (nem pela internet) muda a quantidade
-- solicitada, inclui ou tira itens. Só a loja, pelo link dela, antes da separação começar.
-- A fábrica muda apenas o atendido e o preço.
create or replace function proteger_solicitado() returns trigger
language plpgsql as $$
declare
  v_origem text;
begin
  if current_user not in ('anon', 'authenticated') then
    return coalesce(new, old);   -- funções do sistema (link da loja e do separador)
  end if;
  select origem into v_origem from pedidos where id = coalesce(new.pedido_id, old.pedido_id);
  if v_origem = 'loja' and (
       tg_op in ('INSERT', 'DELETE')
       or new.qtd_pedida is distinct from old.qtd_pedida
       or new.produto_id is distinct from old.produto_id
       or new.pedido_id  is distinct from old.pedido_id) then
    raise exception 'A quantidade solicitada só pode ser alterada pela loja que fez o pedido.';
  end if;
  return coalesce(new, old);
end;
$$;

drop trigger if exists itens_proteger_solicitado on pedido_itens;
create trigger itens_proteger_solicitado
  before insert or update or delete on pedido_itens
  for each row execute function proteger_solicitado();

create or replace function proteger_origem() returns trigger
language plpgsql as $$
begin
  if current_user in ('anon', 'authenticated') and new.origem is distinct from old.origem then
    raise exception 'A origem do pedido não pode ser alterada.';
  end if;
  return new;
end;
$$;

drop trigger if exists pedidos_proteger_origem on pedidos;
create trigger pedidos_proteger_origem
  before update on pedidos
  for each row execute function proteger_origem();

-- =====================================================================
--  ACESSO PELO LINK (solicitantes e entregadores, sem senha)
-- =====================================================================

-- Lê a pessoa dona do link; recusa link errado, desligado ou de loja desligada.
create or replace function pessoa_do_link(p_token text) returns pessoas
language plpgsql security definer set search_path = public as $$
declare
  v pessoas;
begin
  select * into v from pessoas
  where token = p_token and ativo
    and (funcao <> 'solicitante'
         or exists (select 1 from lojas l where l.id = pessoas.loja_id and l.ativo));
  if not found then
    raise exception 'Link inválido ou desativado. Peça um link novo à fábrica.';
  end if;
  return v;
end;
$$;

create or replace function acesso_painel(p_token text) returns json
language plpgsql security definer set search_path = public as $$
declare
  v_p    pessoas;
  v_loja lojas;
begin
  v_p := pessoa_do_link(p_token);

  if v_p.funcao = 'entregador' then
    return json_build_object(
      'funcao', 'entregador',
      'pessoa', json_build_object('id', v_p.id, 'nome', v_p.nome),
      'hoje', hoje_sp(),
      'pedidos', coalesce((
        select json_agg(x order by x.data_entrega, x.numero)
        from (
          select p.id, p.numero, p.status, p.data_entrega, p.observacao,
                 p.recebido_por, p.saiu_em, p.entregue_em,
                 l.nome as loja_nome, l.endereco as loja_endereco,
                 l.telefone as loja_telefone, l.contato as loja_contato,
                 coalesce((
                   select json_agg(json_build_object(
                            'produto', i.produto_nome,
                            'setor', i.setor,
                            'unidade', i.unidade,
                            'qtd', coalesce(i.qtd_atendida, i.qtd_pedida),
                            'preco', i.preco_unit)
                          order by i.ordem, i.produto_nome)
                   from pedido_itens i
                   where i.pedido_id = p.id
                     and coalesce(i.qtd_atendida, i.qtd_pedida) > 0
                 ), '[]'::json) as itens
          from pedidos p
          join lojas l on l.id = p.loja_id
          where p.entregador_id = v_p.id
            and (p.status in ('novo','separacao','pronto','em_rota')
                 or (p.status = 'entregue' and p.entregue_em >= now() - interval '24 hours'))
        ) x
      ), '[]'::json)
    );
  end if;

  if v_p.funcao = 'separador' then
    return json_build_object(
      'funcao', 'separador',
      'pessoa', json_build_object('id', v_p.id, 'nome', v_p.nome, 'setor', v_p.setor),
      'hoje', hoje_sp(),
      'pedidos', coalesce((
        select json_agg(x order by x.data_entrega, x.numero)
        from (
          select p.id, p.numero, p.status, p.data_entrega, p.observacao,
                 l.nome as loja_nome,
                 (select json_agg(json_build_object(
                           'id', i.id, 'produto', i.produto_nome, 'setor', i.setor,
                           'categoria', i.categoria, 'unidade', i.unidade,
                           'qtd_pedida', i.qtd_pedida, 'qtd_atendida', i.qtd_atendida,
                           'separado_por', i.separado_por)
                         order by i.ordem, i.produto_nome)
                  from pedido_itens i
                  where i.pedido_id = p.id and i.qtd_pedida > 0
                    and (v_p.setor is null or i.setor = v_p.setor)) as itens
          from pedidos p
          join lojas l on l.id = p.loja_id
          where p.status in ('novo','separacao','pronto')
            and p.data_entrega <= hoje_sp() + 7
            and exists (select 1 from pedido_itens i
                        where i.pedido_id = p.id and i.qtd_pedida > 0
                          and (v_p.setor is null or i.setor = v_p.setor))
        ) x
      ), '[]'::json)
    );
  end if;

  -- solicitante
  select * into v_loja from lojas where id = v_p.loja_id;
  return json_build_object(
    'funcao', 'solicitante',
    'pessoa', json_build_object('id', v_p.id, 'nome', v_p.nome),
    'loja', json_build_object('id', v_loja.id, 'nome', v_loja.nome,
                              'dias_entrega', v_loja.dias_entrega),
    'hoje', hoje_sp(),
    'produtos', coalesce((
      select json_agg(json_build_object('id', id, 'nome', nome, 'setor', setor,
                                        'categoria', categoria,
                                        'unidade', unidade, 'preco', preco)
                      order by array_position(array['fabrica','industrializados','bebidas','emporios'], setor), categoria nulls last, nome)
      from produtos where ativo
    ), '[]'::json),
    'pedidos', coalesce((
      select json_agg(x order by x.data_entrega desc, x.numero desc)
      from (
        select p.id, p.numero, p.status, p.data_entrega, p.observacao, p.solicitante,
               p.origem, p.nfe, p.recebido_por, p.criado_em, p.saiu_em, p.entregue_em,
               coalesce((
                 select json_agg(json_build_object(
                          'produto_id', i.produto_id, 'produto', i.produto_nome,
                          'setor', i.setor, 'unidade', i.unidade, 'qtd_pedida', i.qtd_pedida,
                          'qtd_atendida', i.qtd_atendida, 'preco', i.preco_unit)
                        order by i.ordem, i.produto_nome)
                 from pedido_itens i where i.pedido_id = p.id
               ), '[]'::json) as itens
        from pedidos p
        where p.loja_id = v_loja.id and p.data_entrega >= hoje_sp() - 45
        order by p.data_entrega desc, p.numero desc
        limit 30
      ) x
    ), '[]'::json)
  );
end;
$$;

-- Entregador: 'sair' (pronto -> na rua) ou 'entregar' (com o nome de quem recebeu)
create or replace function entregador_atualizar(
  p_token text, p_pedido uuid, p_acao text, p_recebido_por text default null
) returns json
language plpgsql security definer set search_path = public as $$
declare
  v_p   pessoas;
  v_ped pedidos;
begin
  v_p := pessoa_do_link(p_token);
  if v_p.funcao <> 'entregador' then
    raise exception 'Este link não é de entregador.';
  end if;

  select * into v_ped from pedidos
  where id = p_pedido and entregador_id = v_p.id
  for update;
  if not found then
    raise exception 'Este pedido não está mais com você. Fale com a fábrica.';
  end if;

  if p_acao = 'sair' then
    if v_ped.status <> 'pronto' then
      raise exception 'Este pedido ainda não está pronto para sair.';
    end if;
    update pedidos set status = 'em_rota', saiu_em = now() where id = p_pedido;

  elsif p_acao = 'entregar' then
    if v_ped.status not in ('pronto','em_rota') then
      raise exception 'Este pedido não pode ser marcado como entregue agora.';
    end if;
    if coalesce(trim(p_recebido_por), '') = '' then
      raise exception 'Informe o nome de quem recebeu.';
    end if;
    update pedidos
       set status = 'entregue',
           entregue_em = now(),
           saiu_em = coalesce(saiu_em, now()),
           recebido_por = trim(p_recebido_por)
     where id = p_pedido;

  else
    raise exception 'Ação inválida.';
  end if;

  return acesso_painel(p_token);
end;
$$;

-- Solicitante: cria um pedido, ou altera um que a fábrica ainda não começou a separar.
-- p_itens: [{"produto_id": "...", "qtd": 10}, ...]  (nome e preço vêm do cadastro)
create or replace function solicitante_enviar_pedido(
  p_token text, p_data date, p_itens json,
  p_observacao text default null, p_pedido uuid default null
) returns json
language plpgsql security definer set search_path = public as $$
declare
  v_p   pessoas;
  v_ped pedidos;
  v_id  uuid;
  v_n   int;
begin
  v_p := pessoa_do_link(p_token);
  if v_p.funcao <> 'solicitante' then
    raise exception 'Este link não é de solicitante.';
  end if;
  if p_data is null or p_data < hoje_sp() then
    raise exception 'Escolha uma data de entrega de hoje em diante.';
  end if;

  select count(*) into v_n
  from json_to_recordset(coalesce(p_itens, '[]'::json)) as it(produto_id uuid, qtd numeric)
  join produtos pr on pr.id = it.produto_id and pr.ativo
  where it.qtd > 0;
  if v_n = 0 then
    raise exception 'Coloque a quantidade de pelo menos um produto.';
  end if;

  if p_pedido is not null then
    select * into v_ped from pedidos
    where id = p_pedido and loja_id = v_p.loja_id
    for update;
    if not found then
      raise exception 'Pedido não encontrado.';
    end if;
    if v_ped.status <> 'novo' then
      raise exception 'A fábrica já começou a separar este pedido. Para mudar, fale com a fábrica.';
    end if;
    update pedidos
       set data_entrega = p_data,
           observacao = nullif(trim(p_observacao), ''),
           solicitante_id = v_p.id,
           solicitante = v_p.nome
     where id = p_pedido;
    delete from pedido_itens where pedido_id = p_pedido;
    v_id := p_pedido;
  else
    insert into pedidos (loja_id, data_entrega, observacao, solicitante_id, solicitante, origem)
    values (v_p.loja_id, p_data, nullif(trim(p_observacao), ''), v_p.id, v_p.nome, 'loja')
    returning id into v_id;
  end if;

  insert into pedido_itens (pedido_id, produto_id, produto_nome, setor, categoria, unidade,
                            qtd_pedida, preco_unit, ordem)
  select v_id, pr.id, pr.nome, pr.setor, pr.categoria, pr.unidade, it.qtd, pr.preco,
         row_number() over (order by array_position(array['fabrica','industrializados','bebidas','emporios'], pr.setor), pr.categoria nulls last, pr.nome)
  from json_to_recordset(p_itens) as it(produto_id uuid, qtd numeric)
  join produtos pr on pr.id = it.produto_id and pr.ativo
  where it.qtd > 0;

  return json_build_object(
    'id', v_id,
    'numero', (select numero from pedidos where id = v_id),
    'painel', acesso_painel(p_token)
  );
end;
$$;

create or replace function solicitante_cancelar_pedido(p_token text, p_pedido uuid) returns json
language plpgsql security definer set search_path = public as $$
declare
  v_p   pessoas;
  v_ped pedidos;
begin
  v_p := pessoa_do_link(p_token);
  if v_p.funcao <> 'solicitante' then
    raise exception 'Este link não é de solicitante.';
  end if;
  select * into v_ped from pedidos
  where id = p_pedido and loja_id = v_p.loja_id
  for update;
  if not found then
    raise exception 'Pedido não encontrado.';
  end if;
  if v_ped.status <> 'novo' then
    raise exception 'A fábrica já começou a separar este pedido. Para cancelar, fale com a fábrica.';
  end if;
  update pedidos set status = 'cancelado' where id = p_pedido;
  return acesso_painel(p_token);
end;
$$;

-- Separador: começa a separar (a loja não altera mais o pedido)
create or replace function separador_iniciar(p_token text, p_pedido uuid) returns json
language plpgsql security definer set search_path = public as $$
declare
  v_p   pessoas;
  v_ped pedidos;
begin
  v_p := pessoa_do_link(p_token);
  if v_p.funcao <> 'separador' then
    raise exception 'Este link não é de separador.';
  end if;
  select * into v_ped from pedidos where id = p_pedido for update;
  if not found then
    raise exception 'Pedido não encontrado.';
  end if;
  if v_ped.status = 'novo' then
    update pedidos set status = 'separacao' where id = p_pedido;
  elsif v_ped.status not in ('separacao','pronto') then
    raise exception 'Este pedido já saiu para entrega ou foi cancelado.';
  end if;
  return acesso_painel(p_token);
end;
$$;

-- Separador: lança o que conseguiu separar dos itens de UM setor do pedido.
-- p_itens: [{"id": "<id do item>", "qtd": 4}, ...]  (0 = não tinha)
-- p_nome: nome de quem separou (obrigatório). p_setor: setor que está sendo separado.
-- Quando todos os itens do pedido (de todos os setores) estão lançados, o pedido fica "pronto".
drop function if exists separador_lancar(text, uuid, json);
create or replace function separador_lancar(
  p_token text, p_pedido uuid, p_itens json, p_nome text, p_setor text default null
) returns json
language plpgsql security definer set search_path = public as $$
declare
  v_p     pessoas;
  v_ped   pedidos;
  v_setor text;
begin
  v_p := pessoa_do_link(p_token);
  if v_p.funcao <> 'separador' then
    raise exception 'Este link não é de separador.';
  end if;
  if coalesce(trim(p_nome), '') = '' then
    raise exception 'Escreva o nome de quem separou.';
  end if;
  if v_p.setor is not null and p_setor is not null and p_setor <> v_p.setor then
    raise exception 'Este link só separa o setor %.',
      case v_p.setor when 'fabrica' then 'Fábrica' when 'industrializados' then 'Industrializados'
                     when 'bebidas' then 'Bebidas/Outros' else 'Empórios' end;
  end if;
  v_setor := coalesce(v_p.setor, p_setor);

  select * into v_ped from pedidos where id = p_pedido for update;
  if not found then
    raise exception 'Pedido não encontrado.';
  end if;
  if v_ped.status not in ('novo','separacao','pronto') then
    raise exception 'Este pedido já saiu para entrega. Para mudar, fale com o escritório.';
  end if;

  update pedido_itens i
     set qtd_atendida = it.qtd, separado_por = trim(p_nome)
    from json_to_recordset(coalesce(p_itens, '[]'::json)) as it(id uuid, qtd numeric)
   where i.id = it.id
     and i.pedido_id = p_pedido
     and it.qtd is not null and it.qtd >= 0
     and (v_setor is null or i.setor = v_setor);

  if exists (select 1 from pedido_itens
             where pedido_id = p_pedido and qtd_atendida is null and qtd_pedida > 0
               and (v_setor is null or setor = v_setor)) then
    raise exception 'Preencha a quantidade separada de todos os itens (coloque 0 no que não tinha).';
  end if;

  if exists (select 1 from pedido_itens where pedido_id = p_pedido and qtd_atendida is null and qtd_pedida > 0) then
    update pedidos set status = 'separacao' where id = p_pedido and status = 'novo';
  else
    update pedidos
       set status = 'pronto', separado_em = coalesce(separado_em, now())
     where id = p_pedido and status in ('novo','separacao');
  end if;

  return acesso_painel(p_token);
end;
$$;

-- ---------- Quem pode chamar cada função ----------
revoke all on function pessoa_do_link(text) from public, anon, authenticated;
revoke all on function acesso_painel(text) from public;
revoke all on function entregador_atualizar(text, uuid, text, text) from public;
revoke all on function solicitante_enviar_pedido(text, date, json, text, uuid) from public;
revoke all on function solicitante_cancelar_pedido(text, uuid) from public;
revoke all on function separador_iniciar(text, uuid) from public;
revoke all on function separador_lancar(text, uuid, json, text, text) from public;
grant execute on function separador_iniciar(text, uuid) to anon, authenticated;
grant execute on function separador_lancar(text, uuid, json, text, text) to anon, authenticated;
grant execute on function acesso_painel(text) to anon, authenticated;
grant execute on function entregador_atualizar(text, uuid, text, text) to anon, authenticated;
grant execute on function solicitante_enviar_pedido(text, date, json, text, uuid) to anon, authenticated;
grant execute on function solicitante_cancelar_pedido(text, uuid) to anon, authenticated;
grant execute on function is_admin() to authenticated;

    const escolhidos = [...sortear(fab, 5 + Math.floor(rnd() * 5)), ...sortear(ind, 1 + Math.floor(rnd() * 2)), ...sortear(beb, 2 + Math.floor(rnd() * 3)), ...sortear(emp, 1 + Math.floor(rnd() * 3))];
    if (rnd() < 0.5){ const rb = beb.find(p => /RED-BULL/.test(p.nome)); if (rb && !escolhidos.includes(rb)) escolhidos.push(rb); }
    escolhidos.sort(porCatNome).forEach((pr, i) => {
      const ped = pr.unidade === 'kg' ? 2 + Math.floor(rnd()*8) : ['cx','fd','pct','bd'].includes(pr.unidade) ? 1 + Math.floor(rnd()*3) : pr.setor !== 'fabrica' ? 2 + Math.floor(rnd()*10) : 20 + Math.floor(rnd()*13)*10;
      let at = null;
      if (comAtendido){ at = ped; const r = rnd(); if (r < 0.08) at = 0; else if (r < 0.22) at = Math.max(0, ped - (pr.setor !== 'fabrica' || pr.unidade !== 'un' ? 1 : 10)); }
      db.itens.push({id:uid(), pedido_id:pid, produto_id:pr.id, produto_nome:pr.nome, setor:pr.setor, categoria:pr.categoria, unidade:pr.unidade, qtd_pedida:ped, qtd_atendida:at, separado_por: at == null ? null : ({industrializados:'Lucas', bebidas:'Paulo', emporios:'Marta'}[pr.setor] || 'Rafael'), preco_unit:pr.preco, ordem:i});
    });
  }
  function mk(loja, data, status, ent, extra){
    const id = uid(), s1 = sol(loja), pelaLoja = s1 && rnd() < 0.6;
    const base = parseISO(data); base.setHours(7, 30, 0, 0);
    const t = h => { const d = new Date(base); d.setHours(h, Math.floor(rnd()*50)); return d.toISOString(); };
    const i = FLUXO.indexOf(status);
    db.pedidos.push(Object.assign({
      id, numero:++db.seq, loja_id:loja.id, data_entrega:data, status,
      entregador_id: ent ? ent.id : null,
      solicitante_id: pelaLoja ? s1.id : null, solicitante: pelaLoja ? s1.nome : null, origem: pelaLoja ? 'loja' : 'escritorio',
      observacao:null, nfe: i >= 4 && loja.emite_nfe ? String(4100 + db.seq) : null,
      recebido_por: i >= 4 ? ['Gerente','Caixa','Supervisora'][Math.floor(rnd()*3)] : null,
      criado_em: new Date(parseISO(data).getTime() - 864e5).toISOString(),
      separado_em: i >= 2 ? t(8) : null, saiu_em: i >= 3 ? t(9) : null, entregue_em: i >= 4 ? t(10) : null,
    }, extra || {}));
    mkItens(id, i >= 2);
  }
  // histórico das últimas 3 semanas
  for (let d = 21; d >= 1; d--){
    const data = addDays(T, -d), dow = parseISO(data).getDay();
    lojas.forEach((l, k) => { if (l.dias_entrega.includes(dow) && rnd() < 0.8) mk(l, data, 'entregue', k % 2 ? marcos : joao); });
  }
  // um atrasado de ontem
  const ontem = db.pedidos.filter(p => p.data_entrega === addDays(T, -1));
  if (ontem.length) Object.assign(ontem[ontem.length-1], {status:'pronto', saiu_em:null, entregue_em:null, recebido_por:null, nfe:null});
  // hoje
  const dowHoje = parseISO(T).getDay();
  const hoje = lojas.filter(l => l.dias_entrega.includes(dowHoje));
  // hoje: um pedido em cada etapa e a última loja do dia ainda sem pedido
  const etapasHoje = ['pronto','novo','entregue','separacao','em_rota','novo'];
  hoje.slice(0, Math.max(1, hoje.length - 1)).forEach((l, k) => {
    const st = etapasHoje[k % etapasHoje.length];
    const ent = st === 'pronto' ? joao : ['entregue','em_rota'].includes(st) ? marcos : null;
    mk(l, T, st, ent, st === 'novo' && sol(l) ? {origem:'loja', solicitante_id:sol(l).id, solicitante:sol(l).nome, observacao:'Mandar bem cedo, por favor.'} : null);
  });
  // próxima entrega da Vila Velha, feita pela loja
  const vv = lojas[3], dvv = proximasEntregas(vv.dias_entrega, addDays(T, 1), 1)[0];
  mk(vv, dvv, 'novo', null, {origem:'loja', solicitante_id:sol(vv).id, solicitante:sol(vv).nome});
  return db;
}

      await pausa();
      const pe = pessoaDoLink(token);
      if (pe.funcao !== 'entregador') throw new Error('Este link não é de entregador.');

      if (!p) throw new Error('Este pedido não está mais com você. Fale com a fábrica.');

      if (!validos.length) throw new Error('Coloque a quantidade de pelo menos um produto.');

      await pausa();
      const pe = pessoaDoLink(token);
      if (pe.funcao !== 'separador') throw new Error('Este link não é de separador.');
      const p = db.pedidos.find(x => x.id === pid);
      if (!p) throw new Error('Pedido não encontrado.');
      if (p.status === 'novo') p.status = 'separacao';
      else if (!['separacao','pronto'].includes(p.status)) throw new Error('Este pedido já saiu para entrega ou foi cancelado.');
      gravar(); return painel(token);

      nome = String(nome || '').trim();
      if (!nome) throw new Error('Escreva o nome de quem separou.');
      if (pe.setor && setor && setor !== pe.setor) throw new Error(`Este link só separa o setor ${SETORES[pe.setor]}.`);
      const stEf = pe.setor || setor || null;
      const p = db.pedidos.find(x => x.id === pid);
      if (!p) throw new Error('Pedido não encontrado.');
      if (!['novo','separacao','pronto'].includes(p.status)) throw new Error('Este pedido já saiu para entrega. Para mudar, fale com o escritório.');
      const doSetor = i => (!stEf || setorDe(i) === stEf) && +i.qtd_pedida > 0;
      const novos = clone(db.itens);
      itens.forEach(x => { const i = novos.find(y => y.id === x.id && y.pedido_id === pid && doSetor(y)); if (i && x.qtd != null && +x.qtd >= 0){ i.qtd_atendida = +x.qtd; i.separado_por = nome; } });
      const doPedido = novos.filter(i => i.pedido_id === pid);
      if (doPedido.some(i => doSetor(i) && i.qtd_atendida == null)) throw new Error('Preencha a quantidade separada de todos os itens (coloque 0 no que não tinha).');
      db.itens = novos;
      if (doPedido.some(i => i.qtd_atendida == null && +i.qtd_pedida > 0)){ if (p.status === 'novo') p.status = 'separacao'; }
      else if (['novo','separacao'].includes(p.status)){ p.status = 'pronto'; p.separado_em = p.separado_em || new Date().toISOString(); }
      gravar(); return painel(token);
    },
    async inserirVarios(tab, lista){ await pausa(); lista.forEach(o => db[tab].push({id:uid(), criado_em:new Date().toISOString(), ativo:true, ...clone(o)})); gravar(); },
    async solicitanteCancelar(token, pid){
      await pausa();
      const pe = pessoaDoLink(token);
      const p = db.pedidos.find(x => x.id === pid && x.loja_id === pe.loja_id);
      if (!p) throw new Error('Pedido não encontrado.');
      if (p.status !== 'novo') throw new Error('A fábrica já começou a separar este pedido. Para cancelar, fale com a fábrica.');
      p.status = 'cancelado'; gravar(); return painel(token);
    },
    restaurar(){ db = semearDemo(); gravar(); },
  };
}

/* ---------------- conexão com o Supabase (site publicado) ---------------- */
function traduzErro(d, status){
  const m = (d && (d.message || d.msg || d.error_description || d.error)) || '';
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Este e-mail ainda não foi confirmado. No Supabase, crie o usuário marcando "Auto Confirm User".';
  if (/row-level security/i.test(m)) return 'Seu login não tem permissão para isso. Confira se o seu e-mail está na lista de administradores.';
  if (/Invalid API key|No API key|apikey/i.test(m)) return 'A chave do Supabase está errada. Confira SUPABASE_KEY no topo do arquivo.';
  if (/JWT/i.test(m)) return 'Sua sessão expirou. Entre de novo.';
  if (/schema cache|does not exist/i.test(m) || status === 404) return 'O banco de dados ainda não está pronto. Rode o script do banco no SQL Editor do Supabase.';
  return m || `Erro ${status}. Tente de novo.`;
}
function criarApiSupabase(){
  const base = CONFIG.SUPABASE_URL.trim().replace(/\/+$/, '');
  const KEY = CONFIG.SUPABASE_KEY.trim();
  const CH = 'parada_pedidos_sessao';
  let sess = ls.get(CH);
  function guardar(d){
    sess = {access_token:d.access_token, refresh_token:d.refresh_token,
      expires_at: d.expires_at || Math.floor(Date.now()/1000) + (d.expires_in || 3600),
      email: (d.user && d.user.email) || (sess && sess.email) || ''};
    ls.set(CH, sess);
  }
  function limpar(){ sess = null; ls.del(CH); }
  async function auth(caminho, corpo){
    let r;
    try { r = await fetch(base + '/auth/v1/' + caminho, {method:'POST', headers:{apikey:KEY, 'Content-Type':'application/json'}, body:JSON.stringify(corpo)}); }
    catch(e) { throw new Error('Sem conexão com o banco de dados. Verifique a internet e o endereço SUPABASE_URL.'); }
    const d = await r.json().catch(() => null);
    if (!r.ok) throw new Error(traduzErro(d, r.status));
    return d;
  }
  async function renovar(){
    if (!sess || (sess.expires_at * 1000 - Date.now() > 60000)) return;
    try { guardar(await auth('token?grant_type=refresh_token', {refresh_token:sess.refresh_token})); }
    catch(e) { limpar(); sessaoExpirou(); throw new Error('Sua sessão expirou. Entre de novo.'); }
  }
  async function http(caminho, {method='GET', body, prefer, publico=false} = {}){
    const headers = {apikey: KEY};
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (prefer) headers.Prefer = prefer;
    if (!publico && sess){ await renovar(); headers.Authorization = 'Bearer ' + sess.access_token; }
    let r;
    try { r = await fetch(base + caminho, {method, headers, body: body !== undefined ? JSON.stringify(body) : undefined}); }
    catch(e) { throw new Error('Sem conexão com o banco de dados. Verifique a internet e tente de novo.'); }
    const txt = await r.text();
    let d = null; try { d = txt ? JSON.parse(txt) : null; } catch(e) {}
    if (!r.ok){
      if (r.status === 401 && !publico && sess){ limpar(); sessaoExpirou(); throw new Error('Sua sessão expirou. Entre de novo.'); }
      throw new Error(traduzErro(d, r.status));
    }
    return d;
  }
  const rpc = (fn, corpo, publico) => http('/rest/v1/rpc/' + fn, {method:'POST', body:corpo || {}, publico});
  const SEL = 'select=*,itens:pedido_itens(*)';
  const ord = ps => (ps || []).map(p => ({...p, itens:(p.itens||[]).sort((a,b) => a.ordem - b.ordem)}));
  const semExtras = (o) => { const c = {...o}; delete c.id; delete c.criado_em; delete c.itens; return c; };
  const linhaItem = (it, pid, i) => ({pedido_id:pid, produto_id:it.produto_id || null, produto_nome:it.produto_nome, setor:setorDe(it), categoria:it.categoria || null, unidade:it.unidade || null, qtd_pedida:+it.qtd_pedida || 0, qtd_atendida: it.qtd_atendida == null ? null : +it.qtd_atendida, separado_por: it.separado_por || null, preco_unit:+it.preco_unit || 0, ordem:i});
  return {
    modo: 'real',
    sessao: () => sess,
    async entrar(email, senha){ guardar(await auth('token?grant_type=password', {email, password:senha})); },
    sair(){ limpar(); },
    eAdmin: () => rpc('is_admin'),
    lojas: () => http('/rest/v1/lojas?select=*&order=nome.asc'),
    produtos: () => http('/rest/v1/produtos?select=*&order=setor.asc,categoria.asc.nullslast,nome.asc'),
    pessoas: () => http('/rest/v1/pessoas?select=*&order=nome.asc'),
    async salvar(tab, obj){
      if (obj.id){ const d = await http(`/rest/v1/${tab}?id=eq.${obj.id}`, {method:'PATCH', body:semExtras(obj), prefer:'return=representation'}); return d[0]; }
      const d = await http(`/rest/v1/${tab}`, {method:'POST', body:semExtras(obj), prefer:'return=representation'}); return d[0];
    },
    async pedidos(de, ate){ return ord(await http(`/rest/v1/pedidos?${SEL}&data_entrega=gte.${de}&data_entrega=lte.${ate}&order=data_entrega.asc,numero.asc`)); },
    async pendentesAntes(data){ return ord(await http(`/rest/v1/pedidos?${SEL}&data_entrega=lt.${data}&status=in.(novo,separacao,pronto,em_rota)&order=data_entrega.asc,numero.asc`)); },
    async pedido(id){ const d = ord(await http(`/rest/v1/pedidos?${SEL}&id=eq.${id}`)); return d[0] || null; },
    async ultimoPedido(lojaId){ const d = ord(await http(`/rest/v1/pedidos?${SEL}&loja_id=eq.${lojaId}&status=neq.cancelado&order=data_entrega.desc,numero.desc&limit=1`)); return d[0] || null; },
    async criarPedido(p, itens){
      const [ped] = await http('/rest/v1/pedidos', {method:'POST', body:p, prefer:'return=representation'});
      if (itens.length) await http('/rest/v1/pedido_itens', {method:'POST', body:itens.map((it, i) => linhaItem(it, ped.id, i))});
      return ped;
    },
    atualizarPedido: (id, campos) => http(`/rest/v1/pedidos?id=eq.${id}`, {method:'PATCH', body:campos}),
    async substituirItens(id, itens){
      await http(`/rest/v1/pedido_itens?pedido_id=eq.${id}`, {method:'DELETE'});
      if (itens.length) await http('/rest/v1/pedido_itens', {method:'POST', body:itens.map((it, i) => linhaItem(it, id, i))});
    },
    excluirPedido: id => http(`/rest/v1/pedidos?id=eq.${id}`, {method:'DELETE'}),
    async atualizarItens(lista){ for (const x of lista) await http(`/rest/v1/pedido_itens?id=eq.${x.id}`, {method:'PATCH', body:{qtd_atendida:x.qtd_atendida, preco_unit:x.preco_unit}}); },
    acessoPainel: token => rpc('acesso_painel', {p_token:token}, true),
    entregadorAtualizar: (token, pid, acao, recebido) => rpc('entregador_atualizar', {p_token:token, p_pedido:pid, p_acao:acao, p_recebido_por:recebido || null}, true),
    solicitanteEnviar: (token, data, itens, obs, pedidoId) => rpc('solicitante_enviar_pedido', {p_token:token, p_data:data, p_itens:itens, p_observacao:obs || null, p_pedido:pedidoId || null}, true),
    solicitanteCancelar: (token, pid) => rpc('solicitante_cancelar_pedido', {p_token:token, p_pedido:pid}, true),
    separadorIniciar: (token, pid) => rpc('separador_iniciar', {p_token:token, p_pedido:pid}, true),
    separadorLancar: (token, pid, itens, nome, setor) => rpc('separador_lancar', {p_token:token, p_pedido:pid, p_itens:itens, p_nome:nome, p_setor:setor || null}, true),
    inserirVarios: (tab, lista) => http(`/rest/v1/${tab}`, {method:'POST', body:lista}),
  };
}

function progressoSetores(p){
  return setoresDoPedido(p).map(st => {
    const its = p.itens.filter(it => setorDe(it) === st);
    const feito = its.every(it => it.qtd_atendida != null);
    const quem = [...new Set(its.map(it => it.separado_por).filter(Boolean))].join(', ');
    return {setor:st, feito, quem};
  });
}
function baseSite(){
  const fixo = (CONFIG.ENDERECO_SITE || '').trim().replace(/\/+$/, '');
  if (fixo) return fixo + '/';
  return location.protocol.startsWith('http') ? location.origin + location.pathname : location.href.split(/[?#]/)[0];
}

function vMarca(sub){
  return `<div class="marca"><span class="marca-logo"><img src="${LOGO}" alt="Parada Ibiraçu"></span><span class="marca-txt"><span class="marca-nome">Parada <em>Pedidos</em></span><span class="marca-sub">${esc(sub)}</span></span></div>`;
}
function vTopo(){
  const abas = [['entregas','Entregas','Entregas'],['novo','Novo pedido','Novo'],['relatorios','Relatórios','Relatórios'],['cadastros','Cadastros','Cadastros']];
  if (S.modo === 'demo') abas.push(['ajuda','Colocar no ar','No ar']);
  return `<header class="topo"><div class="topo-in">${vMarca(CONFIG.EMPRESA)}
    <div class="topo-dir">${S.modo === 'demo' ? '<span class="selo">Versão de teste</span>' : `<span class="quem">${esc((api.sessao()||{}).email || '')}</span><button class="btn-topo" data-a="sair">Sair</button>`}</div>
  </div></header>
  <nav class="abas" aria-label="Seções"><div class="abas-in">${abas.map(([t, l, c]) => `<button class="aba${S.tela === t ? ' ativa' : ''}" data-a="ir" data-tela="${t}"${S.tela === t ? ' aria-current="page"' : ''}><span class="ico">${ICON[t]}</span><span class="l-longa">${l}</span><span class="l-curta">${c}</span></button>`).join('')}</div></nav>`;
}
function vFaixaDemo(){
  return `<div class="faixa-demo"><div class="faixa-demo-in">
    <p><b>Versão de teste.</b> Lojas, produtos e pedidos são exemplos e ficam salvos só neste aparelho. Teste à vontade.</p>
    <div class="grupo"><button class="btn btn-sm btn-sun" data-a="demoVer" data-funcao="solicitante">Ver tela da loja</button><button class="btn btn-sm btn-sun" data-a="demoVer" data-funcao="separador">Ver tela do separador</button><button class="btn btn-sm btn-sun" data-a="demoVer" data-funcao="entregador">Ver tela do entregador</button></div>
  </div></div>`;
}
function vEscritorio(){
  const telas = {entregas:vEntregas, novo:vNovo, relatorios:vRelatorios, cadastros:vCadastros, ajuda:vAjuda};
  return `${vTopo()}${S.modo === 'demo' ? vFaixaDemo() : vFaixaInstalar()}<main class="conteudo">${(telas[S.tela] || vEntregas)()}</main>`;
}

/* ---------------- tela: entregas do dia ---------------- */
function vEntregas(){
  const d = S.data, eHoje = d === today();
  const peds = S.pedidosDia, ativos = peds.filter(p => p.status !== 'cancelado');
  const conta = (...st) => peds.filter(p => st.includes(p.status)).length;
  const valor = ativos.reduce((s, p) => s + totalPedido(p), 0);
  const dow = parseISO(d).getDay();
  const semPedido = S.lojas.filter(l => l.ativo && (l.dias_entrega||[]).includes(dow) && !ativos.some(p => p.loja_id === l.id));
  const cancelados = peds.filter(p => p.status === 'cancelado');
  let h = `<section class="barra-dia">
    <div class="dia-nav">
      <button class="btn-ico" data-a="dia" data-d="-1" aria-label="Dia anterior">‹</button>
      <div class="dia-atual"><span class="dia-nome">${fmtDiaLongo(d)}</span><span class="dia-rel">${relDia(d)}${S.carregando ? ' · atualizando…' : ''}</span></div>
      <button class="btn-ico" data-a="dia" data-d="1" aria-label="Próximo dia">›</button>
      <label class="sr" for="dia-input">Escolher data</label><input id="dia-input" class="dia-input" type="date" value="${d}" data-c="escolherDia">
      ${eHoje ? '' : '<button class="btn btn-sm btn-linha" data-a="hoje">Voltar para hoje</button>'}
    </div>
    <div class="dia-acoes">
      <button class="btn btn-sm btn-linha" data-a="imprimirLote" data-tipo="separacao">Imprimir separações</button>
      <button class="btn btn-sm btn-linha" data-a="imprimirLote" data-tipo="conferencia">Imprimir conferências</button>
      <button class="btn btn-sm btn-linha" data-a="nfeDia">NF-e do dia</button>
      <button class="btn btn-sm btn-linha" data-a="recarregar">Atualizar</button>
    </div>
  </section>
  <section class="tiles" aria-label="Resumo do dia">
    <div class="tile"><span class="t-num">${ativos.length}</span><span class="t-rot">pedidos no dia</span></div>
    <div class="tile st-separacao"><span class="t-num">${conta('novo','separacao')}</span><span class="t-rot">a separar</span></div>
    <div class="tile st-em_rota"><span class="t-num">${conta('pronto','em_rota')}</span><span class="t-rot">prontos ou na rua</span></div>
    <div class="tile st-entregue"><span class="t-num">${conta('entregue')}</span><span class="t-rot">entregues</span></div>
    <div class="tile tile-valor"><span class="t-num">${money(valor)}</span><span class="t-rot">valor do dia</span></div>
  </section>`;
  if (!S.lojas.length){
    h += `<section class="painel"><h2>Comece pelos cadastros</h2><p class="dica">Cadastre as lojas com os dias de entrega, os produtos com preço e as pessoas que vão ter acesso (solicitantes das lojas e entregadores).</p><div><button class="btn btn-prim" data-a="ir" data-tela="cadastros">Ir para cadastros</button></div></section>`;
  }
  if (eHoje && S.atrasados.length){
    h += `<section class="painel painel-alerta"><div class="painel-cab"><h2>Pedidos de dias anteriores ainda não entregues</h2></div>

/* ---------------- fatura mensal da loja (modelo da planilha) ---------------- */
const PERIODOS = [[1,5],[6,10],[11,15],[16,20],[21,25],[26,31]];
const periodoDe = data => { const d = +data.slice(8, 10); return PERIODOS.findIndex(([a, b]) => d >= a && d <= b); };
const nomeMes = mes => { const [y, m] = mes.split('-').map(Number); return `${cap(MESES[m - 1])}/${y}`; };
function calcFatura(peds, lojaId){
  const entregues = peds.filter(p => p.status === 'entregue' && p.loja_id === lojaId);
  const mapa = new Map();
  entregues.forEach(p => { const k = periodoDe(p.data_entrega); itensValidos(p).forEach(it => {
    const chave = it.produto_nome + '|' + (it.unidade || '');
    let l = mapa.get(chave);
    if (!l){ l = {nome:it.produto_nome, unidade:it.unidade || '', setor:setorDe(it), categoria:it.categoria || '', qtd:[0,0,0,0,0,0], total:0, valor:0, preco:+it.preco_unit || 0}; mapa.set(chave, l); }
    const q = qtdEfetiva(it); l.qtd[k] += q; l.total += q; l.valor += q * (+it.preco_unit || 0); l.preco = +it.preco_unit || 0;
  }); });
  const linhas = [...mapa.values()].sort(porCatNome);
  const porSetor = ORDEM_SETOR.map(st => ({setor:st, linhas:linhas.filter(l => l.setor === st)})).filter(g => g.linhas.length);
  porSetor.forEach(g => { g.valor = g.linhas.reduce((a, l) => a + l.valor, 0); });
  const abertos = peds.filter(p => p.loja_id === lojaId && ABERTOS.includes(p.status)).length;
  return {linhas, porSetor, valor:linhas.reduce((a, l) => a + l.valor, 0), pedidos:entregues.length, abertos};
}
const precoFatura = l => l.total ? (Math.abs(l.valor - l.total * l.preco) < 0.005 ? l.preco : l.valor / l.total) : l.preco;
function tsvFatura(lojaId, F){
  const cab = ['Produto','Setor','Un.', ...PERIODOS.map(([a, b]) => `${a} a ${b}`), 'Qtd no mês','Preço','Valor'];
  const lin = F.linhas.map(l => [l.nome, SETORES[l.setor], l.unidade, ...l.qtd.map(q => q ? NUM.format(q) : ''), NUM.format(l.total), NUM2.format(precoFatura(l)), NUM2.format(l.valor)]);
  const subt = F.porSetor.map(g => [`Total ${SETORES[g.setor]}`, '', '', '', '', '', '', '', '', '', '', NUM2.format(g.valor)]);
  return [[`Fatura ${nomeMes(S.rel.mes)} · ${nomeLoja(lojaId)}`], cab, ...lin, ...subt, ['Total geral', '', '', '', '', '', '', '', '', '', '', NUM2.format(F.valor)]].map(r => r.join('\t')).join('\n');
}

/* ---------------- tela: relatórios ---------------- */
function calcularRelatorio(peds){
  const entregues = peds.filter(p => p.status === 'entregue'), abertos = peds.filter(p => ABERTOS.includes(p.status));
  const faturado = entregues.reduce((s, p) => s + totalPedido(p), 0);
  const aberto = abertos.reduce((s, p) => s + totalPedido(p), 0);
  const ag = (chave, nome) => { const m = {}; entregues.forEach(p => { const k = chave(p); m[k] = m[k] || {id:k, nome:nome(p), n:0, valor:0}; m[k].n++; m[k].valor += totalPedido(p); }); return Object.values(m).sort((a,b) => b.valor - a.valor); };
  const porProduto = {};
  entregues.forEach(p => itensValidos(p).forEach(it => { const k = it.produto_nome + '|' + (it.unidade||''); porProduto[k] = porProduto[k] || {nome:it.produto_nome, unidade:it.unidade||'', qtd:0, valor:0}; porProduto[k].qtd += qtdEfetiva(it); porProduto[k].valor += qtdEfetiva(it) * (+it.preco_unit||0); }));
  const porSetor = {};
  entregues.forEach(p => itensValidos(p).forEach(it => { const st = setorDe(it); porSetor[st] = porSetor[st] || {nome:SETORES[st], itens:0, valor:0}; porSetor[st].itens++; porSetor[st].valor += qtdEfetiva(it) * (+it.preco_unit||0); }));
  const porDia = {};
  entregues.forEach(p => { porDia[p.data_entrega] = porDia[p.data_entrega] || {data:p.data_entrega, n:0, valor:0}; porDia[p.data_entrega].n++; porDia[p.data_entrega].valor += totalPedido(p); });
  return {faturado, aberto, nEnt:entregues.length, nAb:abertos.length, ticket: entregues.length ? faturado / entregues.length : 0,
    porLoja: ag(p => p.loja_id, p => nomeLoja(p.loja_id)),
    porEnt: ag(p => p.entregador_id || '-', p => p.entregador_id ? nomePessoa(p.entregador_id) || 'Entregador removido' : 'Sem entregador'),
    porProduto: Object.values(porProduto).sort((a,b) => b.valor - a.valor),
    porSetor: ORDEM_SETOR.filter(st => porSetor[st]).map(st => porSetor[st]),
    porDia: Object.values(porDia).sort((a,b) => a.data.localeCompare(b.data))};
}
const TSV = {};
function tabelaRel(id, titulo, cols, linhas, valorMax){

    ${linhas.length ? `<div class="tabela-rolar"><table><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.t}</th>`).join('')}${valorMax ? '<th><span class="sr">Proporção do valor</span></th>' : ''}</tr></thead>
    <tbody>${linhas.map(l => `<tr>${cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.h(l)}</td>`).join('')}${valorMax ? `<td class="barra-cel"><span class="barra" style="--p:${Math.max(1, l.valor / valorMax * 100).toFixed(1)}%"></span></td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<p class="vazio">Sem entregas no período.</p>'}
  </section>`;
}
function vRelatorios(){
  const r = S.rel;
  let h = `<section class="pag-cab"><h1>Relatórios</h1><div class="dia-nav"><label class="rotulo" for="rel-mes">Mês</label><input id="rel-mes" type="month" value="${r.mes}" data-c="relMes" style="width:auto"><button class="btn btn-sm btn-linha" data-a="relCarregar">Atualizar</button></div></section>`;
  if (!r.pedidos) return h + '<p class="vazio">Carregando…</p>';
  const R = calcularRelatorio(r.pedidos);
  const maxL = Math.max(1, ...R.porLoja.map(x => x.valor)), maxE = Math.max(1, ...R.porEnt.map(x => x.valor)), maxP = Math.max(1, ...R.porProduto.map(x => x.valor)), maxD = Math.max(1, ...R.porDia.map(x => x.valor));
  const fmtN2 = v => NUM2.format(v);
  h += `<section class="tiles tiles-4" aria-label="Resumo do mês">

/* ---------------- importar produtos colando do Excel ---------------- */
function normUnidade(u){
  const t = semAcento(u).replace(/[^a-z]/g, '');
  if (!t) return null;
  if (['un','und','unid','unidade','unidades','u'].includes(t)) return 'un';
  if (['kg','kilo','quilo','kgs'].includes(t)) return 'kg';
  if (['pct','pc','pacote','pacotes'].includes(t)) return 'pct';
  if (['cx','caixa','caixas'].includes(t)) return 'cx';
  if (['dz','duzia'].includes(t)) return 'dz';
  if (['fd','fardo'].includes(t)) return 'fd';
  if (['bd','balde'].includes(t)) return 'bd';
  return String(u).trim().toLowerCase();
}
function lerPlanilhaProdutos(texto, setorPadrao){
  const linhas = String(texto || '').replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (!linhas.length) return {lidos:[], erros:['Cole as linhas da planilha no quadro.']};
  const sep = linhas[0].includes('\t') ? '\t' : linhas[0].includes(';') ? ';' : ',';
  let rows = linhas.map(l => l.split(sep).map(c => c.trim().replace(/^"|"$/g, '').trim()));
  const cab = rows[0].map(c => semAcento(c).replace(/[^a-z]/g, ''));
  const acha = (...nomes) => cab.findIndex(c => nomes.some(n => c === n || c.startsWith(n)));
  let idx = {codigo:acha('codigo','cod'), nome:acha('produto','nome','descricao','item','mercadoria'), preco:acha('preco','valor','vlr','venda','pv'), setor:acha('setor'), categoria:acha('categoria','grupo','tipo','familia'), unidade:acha('unidade','und','unid','un','medida')};
  const temCab = idx.nome >= 0 || idx.preco >= 0;
  if (temCab) rows = rows.slice(1); else idx = {codigo:-1, nome:0, preco:-1, setor:-1, categoria:-1, unidade:-1};
  if (idx.nome < 0) idx.nome = 0;
  const lidos = [], erros = [];
  rows.forEach((r, n) => {
    const nome = (r[idx.nome] || '').trim();
    if (!nome) return;
    const linha = n + (temCab ? 2 : 1);
    const txtPreco = idx.preco >= 0 ? r[idx.preco] : [...r].reverse().find((c, k) => k !== r.length - 1 - idx.nome && /\d/.test(c));
    const preco = parseNum(String(txtPreco || '').replace(/R\$/i, ''));
    if (preco == null || preco < 0){ erros.push(`Linha ${linha}: "${nome}" está sem preço.`); return; }
    const st = idx.setor >= 0 ? semAcento(r[idx.setor]) : '';
    const setorLido = /empor/.test(st) ? 'emporios' : /bebid|outros|limpez|descart/.test(st) ? 'bebidas' : /indust|distrib|revend|terceir/.test(st) ? 'industrializados' : /fab|propri|produc/.test(st) ? 'fabrica' : null;
    lidos.push({nome, preco:Math.round(preco * 100) / 100, setor:setorLido || setorPadrao, setorInformado:!!setorLido,
      categoria: idx.categoria >= 0 ? ((r[idx.categoria] || '').trim() || null) : null,
      unidade: idx.unidade >= 0 ? normUnidade(r[idx.unidade]) : null,
      codigo_parceiro: idx.codigo >= 0 && /^\d+$/.test((r[idx.codigo] || '').trim()) && +r[idx.codigo] > 0 ? String(+r[idx.codigo]) : null});
  });
  if (!lidos.length && !erros.length) erros.push('Não encontrei produtos. Confira se copiou as colunas com o nome e o preço.');
  return {lidos, erros};
}
function planoImportacao(lidos){
  const chave = n => semAcento(n).replace(/\s+/g, ' ').trim();
  const existentes = new Map(S.produtos.map(p => [chave(p.nome), p]));
  const unicos = new Map();
  lidos.forEach(x => unicos.set(chave(x.nome), x));
  const novos = [], alterados = [];
  let iguais = 0;
  unicos.forEach((x, k) => {
    const ex = existentes.get(k);
    if (!ex){ novos.push({nome:x.nome, setor:x.setor, categoria:x.categoria, unidade:x.unidade || 'un', preco:x.preco, codigo_parceiro:x.codigo_parceiro || null, ativo:true}); return; }
    const mud = {}, txt = [];
    if (Math.abs((+ex.preco || 0) - x.preco) > 0.0001){ mud.preco = x.preco; txt.push(`preço ${money(ex.preco)} → ${money(x.preco)}`); }
    if (x.setorInformado && setorDe(ex) !== x.setor){ mud.setor = x.setor; txt.push(`setor → ${SETORES[x.setor]}`); }
    if (x.categoria && x.categoria !== ex.categoria){ mud.categoria = x.categoria; txt.push(`categoria → ${x.categoria}`); }
    if (x.unidade && x.unidade !== ex.unidade){ mud.unidade = x.unidade; txt.push(`unidade → ${x.unidade}`); }
    if (x.codigo_parceiro && x.codigo_parceiro !== ex.codigo_parceiro){ mud.codigo_parceiro = x.codigo_parceiro; txt.push(`código Parceiro → ${x.codigo_parceiro}`); }
    if (!ex.ativo){ mud.ativo = true; txt.push('reativado'); }
    if (txt.length) alterados.push({id:ex.id, nome:ex.nome, mud, txt:txt.join(' · ')}); else iguais++;
  });
  return {novos, alterados, iguais};
}

function vMeusPedidos(d){
  if (!d.pedidos.length) return '<p class="vazio">Nenhum pedido nos últimos 45 dias.</p>';
  return d.pedidos.map(p => {
    const total = p.itens.reduce((s, i) => s + (i.qtd_atendida != null ? +i.qtd_atendida : +i.qtd_pedida) * (+i.preco || 0), 0);
    const separado = p.itens.some(i => i.qtd_atendida != null);
    return `<article class="a-card st-${p.status}">
      <div class="a-l1">${pill(p.status)}<span class="num">#${p.numero}</span><span>Entrega ${fmtDia(p.data_entrega)}</span></div>

      ${p.status === 'em_rota' ? `<p class="dica">Saiu para entrega às ${hora(p.saiu_em)}.</p>` : ''}
